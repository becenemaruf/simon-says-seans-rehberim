const mem={};
const st=k=>{if(k in mem)return mem[k];try{const v=localStorage.getItem("ssr:"+k);return v===null?null:JSON.parse(v)}catch(e){return null}};
const put=(k,v)=>{mem[k]=v;try{localStorage.setItem("ssr:"+k,JSON.stringify(v))}catch(e){}};
const $=id=>document.getElementById(id);
const cv=c=>`--bc:var(--${c});--bs:var(--${c}-s)`;
const pv=p=>`--pc:var(--${PH[p].c});--ps:var(--${PH[p].c}-s)`;

let noReset={};
function resetHTML(n){
  if(!st(`s${n}done`)||noReset[n])return "";
  return `<div class="reset" role="group" aria-label="İşaretleri temizle"><h4>Seans bitti. Başka bir seans için işaretler kaldırılsın mı?</h4>
  <p>Portal veri tutmaz; aynı oturumu başka bir çocukla uygulayacaksan işaretleri temizleyebilirsin. Bu oturumdaki bütün işaretler (hızlı ve ayrıntılı) ve "tamamlandı" durumu silinir.</p>
  <label><input type="checkbox" id="rNotes"> Kayıt alanlarındaki notları da sil (bir sonraki oturumda görünmez)</label>
  <div class="rb"><button type="button" class="ry" data-reset="yes">Evet, temizle</button><button type="button" class="rn" data-reset="no">Hayır</button></div></div>`}
function clearSession(n,notes){
  const re=new RegExp(`^s${n}(p\\d|q\\d|done${notes?"|f":""})`);
  Object.keys(mem).forEach(k=>{if(re.test(k))delete mem[k]});
  try{Object.keys(localStorage).forEach(k=>{if(k.startsWith("ssr:")&&re.test(k.slice(4)))localStorage.removeItem(k)})}catch(e){}
}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function keys(n,p){const out=[];const P=DATA[n].phases[p];P.forEach((b,bi)=>{(b.i||[]).forEach((_,i)=>out.push(`s${n}p${p}b${bi}i${i}`))});return out}
function pct(n,p){const k=keys(n,p);if(!k.length)return 0;return Math.round(100*k.filter(x=>st(x)).length/k.length)}

  <div class="phases">${PH.map(p=>`<span><b style="background:var(--${p.c})">${p.n}</b>${p.t}</span>`).join("")}</div></div></div></section><main class="gut"><div class="wrap">`;

function item(id,txt,extra){const on=st(id)?"checked":"";return `<label class="chk"><input type="checkbox" data-k="${id}" ${on}><span class="lt">${txt}${extra&&extra!=="pdf"?sk(extra):""}</span>${extra==="pdf"?`<span class="pdf">PDF</span>`:""}</label>`}

function phaseHTML(n,p){
  const P=DATA[n].phases[p]; let h="";
  if(p===1){
    const acts=P.filter(b=>b.a);
    h+=`<div class="tl" aria-label="Oturum akışı">${acts.map((b,i)=>`<button type="button" data-jump="a${b.a}" style="flex:${b.dk};background:var(--${ACT_C[i%ACT_C.length]})" title="${b.t}"><b>${b.a}</b><span>${b.dk} dk</span></button>`).join("")}</div><p class="tlnote">Süreler kesin değil, tahmini öneridir.</p>`;
  }
  P.forEach((b,bi)=>{
    const base=`s${n}p${p}b${bi}`;
    if(b.a){
      const c=ACT_C[(b.a-1)%ACT_C.length];
      const ks=b.i.map((_,i)=>base+"i"+i); const dn=ks.filter(k=>st(k)).length;
      h+=`<article class="act" id="a${b.a}" style="--ac:var(--${c});--as:var(--${c.replace('-d','')}-s)"><div class="acth"><span class="an">${b.a}</span><b>${b.t}</b><span class="ok" data-ok="${base}">${dn}/${ks.length}</span></div>
      <div class="tags"><span class="t-dk">${b.dk} dk</span>${b.mat?`<span class="t-mat">Materyal: ${b.mat}</span>`:""}${b.koc?`<span class="t-koc">${b.koc}</span>`:""}<span>Kılavuz ${b.ref}</span></div>
      <div class="items">${b.i.map((x,i)=>Array.isArray(x)?item(base+"i"+i,x[0],x[1]):item(base+"i"+i,x)).join("")}</div></article>`;return}
    if(b.done){const d=st(`s${n}done`);h+=`<div class="done ${d?'is':''}"><button type="button" id="doneBtn">${d?"✓ Seans tamamlandı":"Seansı tamamlandı olarak işaretle"}</button><span>${d?"Ana ekranda bu oturum tamamlandı olarak görünür.":"Bütün maddeleri bitirdiğinde işaretle."}</span></div>`+resetHTML(n);return}
    h+=`<div class="grp"><div class="gh"><span class="gi">${ICON[b.ic]||""}</span><h4>${b.g}</h4></div>`;
    if(b.note) h+=`<p class="note">${b.note}</p>`;
    if(b.prev){const vals=b.pf.map(f=>[f[1],st(`s${b.prev}f${f[0]}`)]);const any=vals.some(v=>v[1]);
      h+=`<div class="prevbox">${any?vals.map(v=>`<div><span>${v[0]}</span><b>${v[1]||"—"}</b></div>`).join(""):`<p style="margin:0">${b.prev}. Oturumda henüz not kaydedilmedi. Notlar, o oturumun “Seansı tamamla” bölümünde girildiğinde burada görünür.</p>`}</div>`}
    if(b.i) h+=b.i.map((x,i)=>Array.isArray(x)?item(base+"i"+i,x[0],x[1]):item(base+"i"+i,x)).join("");
    if(b.f) h+=b.f.map(f=>`<div class="field"><label for="f${n}${f[0]}">${f[1]}</label><input id="f${n}${f[0]}" data-f="s${n}f${f[0]}" value="${(st(`s${n}f${f[0]}`)||"").replace(/"/g,"&quot;")}"></div>`).join("");
    h+=`</div>`;
  });
  if(p<2) h+=`<div class="nextp" style="--pn:var(--${PH[p+1].c})"><button type="button" data-ph="${p+1}">Sonraki: ${PH[p+1].t} →</button></div>`;
  return h+`<p class="foot">İşaretler ve notlar yalnızca bu cihazda saklanır.</p>`;
}

let curS=0,curP=0,curV="",retQ=null;
function shead(n){const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n];
  return `<section class="shead ${s[1]===0?'multi':''}" style="${cv(b.c)}"><span class="big">${n}</span><div><div class="k">${b.tag} · ${s[3]}</div><h1>${s[2]}</h1>${D?`<div class="facts">${D.facts.map(f=>`<span>${f}</span>`).join("")}</div>`:""}</div>${SICON[n]?`<span class="sico">${SICON[n]}</span>`:""}</section>`}
function seg(n,v){const q=DATA[n]&&DATA[n].quick;
  return `<div class="seg" role="group" aria-label="Kullanım düzeyi"><button type="button" data-mode="hizli" aria-pressed="${v==="hizli"}" ${q?"":"disabled title='Bu oturumun hızlı özeti hazırlanıyor'"}>⚡ Hızlı Hazırlık</button><button type="button" data-mode="rehber" aria-pressed="${v==="rehber"}">☰ Adım Adım Rehber</button></div>`}
const QI=['<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>'];
const MI={q:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  g:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>'};
function entry(n){
  curS=n;curP=0;curV="";retQ=null;
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n],q=D&&D.quick;
  $("home").hidden=false;
  const prog=D?PH.map((ph,i)=>`${ph.t} %${pct(n,i)}`).join(" · "):"";
  $("view").innerHTML=`<main class="gut"><div class="wrap">${shead(n)}
   <div class="modes" style="${cv(b.c)}">
    <button class="mode" type="button" data-mode="hizli" ${q?"":"disabled"}><span class="mi">${MI.q}</span><span class="ml">A</span><strong>Hızlı Hazırlık</strong><p>Seansın temel akışını, gerekli materyalleri ve yapılacakları tek bakışta görün.</p><span class="go">${q?"Aç →":"Bu oturum için hazırlanıyor"}</span></button>
    <button class="mode" type="button" data-mode="rehber"><span class="mi">${MI.g}</span><span class="ml">B</span><strong>Adım Adım Rehber</strong><p>Seans öncesinden kapanışa kadar ayrıntılı kontrol listeleriyle ilerleyin.</p><span class="go">${D?prog:"Aç →"}</span></button>
   </div>
   <p class="foot">İki görünüm aynı oturum içeriğini kullanır; istediğin an aralarında geçebilirsin.</p>
  </div></main>`;
  try{history.replaceState(null,"","#oturum-"+n)}catch(e){}
}
function quick(n){
  curS=n;curV="hizli";retQ=null;
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n],Q=D.quick,P=D.phases;
  $("home").hidden=false;
  const qk=(sec,i)=>`s${n}q${sec}i${i}`;
  const grp=(p,ic)=>P[p].find(x=>x.ic===ic&&!x.prev);
  const pr=grp(0,"print"),tb=grp(0,"box"),pv0=P[0].find(x=>x.prev||x.ic==="back");
  const pdfs=pr?pr.i.map(x=>Array.isArray(x)?x[0]:x):[], mats=tb?tb.i.map(x=>Array.isArray(x)?x[0]:x):[];
  const acts=P[1].filter(x=>x.a), sv=P[2].find(x=>x.f), nx=P[2].find(x=>x.ic==="next");
  const sec=(c,title,ph,body)=>`<section class="qs" style="--qc:var(--${c});--qs:var(--${c}-s);--pc:var(--${c});--ps:var(--${c}-s)"><h3><span class="qh"><i>${QI[ph]}</i>${title}</span><button class="more" type="button" data-detail="${ph}">Ayrıntılı: ${PH[ph].t}</button></h3>${body}</section>`;
  let once=Q.once.map((x,i)=>item(qk(0,i),x)).join("");
  if(pdfs.length) once+=`<div class="chips" aria-label="Çıktılar">${pdfs.map(x=>`<span class="pd">PDF · ${x}</span>`).join("")}</div>`;
  if(mats.length) once+=`<div class="chips" aria-label="Materyaller">${mats.map(x=>`<span>${x}</span>`).join("")}</div>`;
  if(pv0){ if(pv0.prev){const v=pv0.pf.map(f=>[f[1],st(`s${pv0.prev}f${f[0]}`)]).filter(x=>x[1]);once+=`<p class="qnote"><b>${pv0.prev}. Oturumdan:</b> ${v.length?v.map(x=>`${x[0]}: ${x[1]}`).join(" · "):"henüz not kaydedilmedi."}</p>`}
    else if(pv0.note) once+=`<p class="qnote"><b>Önceki oturum:</b> ${pv0.note}</p>`}
  const tot=Q.flow.reduce((t,f)=>t+f.a.reduce((u,a)=>u+(acts.find(x=>x.a===a)||{dk:0}).dk,0),0);
  const flow=`<p class="qflow">Toplam ≈ ${tot} dk<em>Süreler kesin değil, tahmini öneridir.</em></p>`+Q.flow.map((f,i)=>{const A=f.a.map(a=>acts.find(x=>x.a===a)).filter(Boolean);
    const dk=A.reduce((t,x)=>t+x.dk,0), mat=A.map(x=>x.mat).filter(Boolean).join(" · "), ref=A.map(x=>x.ref.split(" · ")[0]).join(", ");
    const on=st(qk(1,i))?"checked":"";
    return `<div class="qrow"><label class="chk"><input type="checkbox" data-k="${qk(1,i)}" ${on}><span class="lt"><b>${f.t}</b> <span class="dk">${dk} dk</span><span class="qmeta">${f.h}</span><span class="qmeta">${mat?"Materyal: "+mat+" · ":""}Kılavuz ${ref}</span></span></label><button class="more" type="button" data-detail="1:a${f.a[0]}">Ayrıntılı adımları gör</button></div>`}).join("");
  let after=Q.after.map((x,i)=>item(qk(2,i),x)).join("");
  if(sv) after+=sv.f.map(f=>`<div class="field"><label for="q${n}${f[0]}">${f[1]}</label><input id="q${n}${f[0]}" data-f="s${n}f${f[0]}" value="${(st(`s${n}f${f[0]}`)||"").replace(/"/g,"&quot;")}"></div>`).join("");
  if(nx) after+=`<p class="qnote"><b>${nx.g}:</b> ${nx.i.map(x=>Array.isArray(x)?x[0]:x).join(" ")}</p>`;
  const d=st(`s${n}done`);
  $("view").innerHTML=`<main class="gut"><div class="wrap">${shead(n)}${seg(n,"hizli")}
   <div class="qp">${sec("teal","Seans öncesi",0,once)}${sec("rust","Seans akışı",1,flow)}${sec("plum","Seans sonrası",2,after)}
   <div class="done ${d?'is':''}" style="--pc:var(--plum);--ps:var(--plum-s)"><button type="button" id="doneBtn">${d?"✓ Seans tamamlandı":"Seansı tamamlandı olarak işaretle"}</button><span>Hızlı işaretler ayrıntılı rehberdeki adımları otomatik tamamlamaz.</span></div>${resetHTML(n)}
   <p class="foot">İşaretler ve notlar yalnızca bu cihazda saklanır. Kayıt alanları iki görünümde ortaktır.</p></div>
  </div></main>`;
  try{history.replaceState(null,"","#oturum-"+n+"/hizli")}catch(e){}
}
function session(n,p=0){
  curS=n;curP=p;curV="rehber";
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n];
  $("home").hidden=false;
  const tabs=PH.map((ph,i)=>{const v=D?pct(n,i):0;return `<button class="tab" role="tab" type="button" data-ph="${i}" aria-selected="${i===p}" style="${pv(i)}"><span class="ring" style="--p:${v}"><b>${ph.n}</b></span><span class="tx"><small>BÖLÜM ${ph.n}</small><strong>${ph.t}</strong><em>${ph.e}</em></span></button>`}).join("");
  $("view").innerHTML=`<main class="gut"><div class="wrap">
   ${shead(n)}${seg(n,"rehber")}
   <div class="tabs" role="tablist">${tabs}</div>
   ${retQ&&retQ.n===n?`<button class="backq" id="backQ" type="button">← Hızlı Hazırlık'ta kaldığın yere dön</button>`:""}
   <div class="panel" style="${pv(p)}">${D?phaseHTML(n,p):`<div class="empty"><h3>${PH[p].t}: hazırlanıyor</h3><p style="margin:0">Bu oturumun kontrol listesi henüz eklenmedi.</p></div>`}</div>
  </div></main>`;
  try{history.replaceState(null,"","#oturum-"+n+"/rehber")}catch(e){}
}
function refresh(){
  if(!DATA[curS]||curV!=="rehber")return;
  document.querySelectorAll(".tab").forEach((t,i)=>t.querySelector(".ring").style.setProperty("--p",pct(curS,i)));
  document.querySelectorAll("[data-ok]").forEach(el=>{const b=el.dataset.ok;const all=[...document.querySelectorAll(`[data-k^="${b}i"]`)];el.textContent=all.filter(x=>x.checked).length+"/"+all.length});
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-s]"); if(c){entry(+c.dataset.s);window.scrollTo({top:0});return}
  const md=e.target.closest("[data-mode]"); if(md){if(md.disabled)return;md.dataset.mode==="hizli"?quick(curS):session(curS,curP);window.scrollTo({top:0});return}
  const dt=e.target.closest("[data-detail]"); if(dt){const [ph,a]=dt.dataset.detail.split(":");retQ={n:curS,y:window.scrollY};session(curS,+ph);const el=a&&$(a);if(el)el.scrollIntoView({block:"start"});else window.scrollTo({top:0});return}
  const t=e.target.closest("[data-ph]"); if(t){session(curS,+t.dataset.ph);document.querySelector(".tabs").scrollIntoView({block:"start",behavior:"smooth"});return}
  const j=e.target.closest("[data-jump]"); if(j){$(j.dataset.jump).scrollIntoView({behavior:"smooth"});return}
  if(e.target.closest("#backQ")){const r=retQ;retQ=null;quick(r.n);window.scrollTo({top:r.y});return}
  const rs=e.target.closest("[data-reset]"); if(rs){const n=curS;
    if(rs.dataset.reset==="yes"){const notes=$("rNotes")&&$("rNotes").checked;clearSession(n,notes);curV==="hizli"?quick(n):session(n,0);window.scrollTo({top:0});toast(notes?"İşaretler ve notlar temizlendi":"İşaretler temizlendi")}
    else{noReset[n]=true;rs.closest(".reset").remove()}return}
  if(e.target.id==="doneBtn"){const k=`s${curS}done`;put(k,!st(k));delete noReset[curS];curV==="hizli"?quick(curS):session(curS,curP);return}
});
document.addEventListener("change",e=>{if(e.target.dataset.k){put(e.target.dataset.k,e.target.checked);refresh()}});
document.addEventListener("input",e=>{if(e.target.dataset.f)put(e.target.dataset.f,e.target.value)});
$("home").onclick=()=>{home();window.scrollTo({top:0})};
$("brand").onclick=()=>{home();window.scrollTo({top:0})};
const m=location.hash.match(/^#oturum-(\d+)(?:\/(hizli|rehber))?$/);
if(m&&+m[1]>=1&&+m[1]<=20){curS=+m[1];m[2]==="hizli"&&DATA[curS]&&DATA[curS].quick?quick(curS):m[2]==="rehber"?session(curS):entry(curS)}else home();
</script>
</body>
</html>
