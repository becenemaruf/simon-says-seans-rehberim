<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simon Says Seans Rehberim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: lacivert, noktalı zemin üstünde siyah çerçeveli, kaydırılmış gölgeli kâğıt kartlar.
   Kitap renkleri: Giriş mor · ÇK1 sarı · ÇK2 pembe · ÇK3 turkuaz · ÇK4 kırmızı. Bölüm renkleri: Hazırlan turkuaz · Uygula pembe · Tamamla sarı.
   Tek görünüm (koyu zemin + açık kâğıt yüzeyler), her renk açıkça tanımlı. */
:root{
  --navy:#111C38; --navy-2:#1A2750; --navy-3:#24335F; --dot:rgba(255,255,255,.06);
  --ink:#0E1222; --paper:#FFFFFF; --cream:#F7F2E9; --muted:#5A6177; --soft:#C3CBE0; --line:#D9D3C7;
  --yellow:#FFD23F; --pink:#FF5FA2; --teal:#16B3A2; --red:#E8412E; --plum:#8A2A8C;
  --yellow-s:#FFF5D1; --pink-s:#FFE3EF; --teal-s:#DDF5F1; --red-s:#FDE3DE; --plum-s:#F3E2F3;
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:18px; --bw:2px; --sh:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance}

/* üst bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--navy);border-bottom:2px solid var(--navy-3)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.logo{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:12px;padding:4px 8px;box-shadow:3px 3px 0 var(--pink);display:block}
.logo img{height:34px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.back{margin-left:auto;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 var(--yellow);white-space:nowrap}
.back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--yellow)}
@media (max-width:460px){.brand b{font-size:15px}.logo img{height:28px}.back{padding:6px 11px;font-size:13px}}

/* ortak kâğıt kart */
.paper{background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--shc,var(--ink))}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.eyebrow::before{content:"";width:26px;height:2px;background:currentColor}

/* ana ekran */
.hero{padding-block:44px 30px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.02;margin:14px 0 18px;letter-spacing:-.01em}
.hl{display:inline-block;background:var(--pink);color:var(--paper);padding:2px 14px 6px;border:var(--bw) solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg);margin-top:6px}
.hero p{color:var(--soft);max-width:52ch;margin:0 0 20px;font-size:17px}
.steps{display:flex;flex-wrap:wrap;gap:10px}
.steps span{display:inline-flex;align-items:center;gap:8px;background:var(--navy-2);border:2px solid var(--navy-3);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px}
.steps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:13px;color:var(--ink);border:2px solid var(--ink)}
.note-card{padding:22px 24px;--shc:var(--teal);transform:rotate(1deg)}
.note-card h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px}
.note-card .sub{color:var(--muted);font-size:14px;margin:0}
.hand{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:2px dashed var(--line);display:grid;gap:8px;font-family:var(--f-hand);font-size:25px;line-height:1.1}
.hand li{display:flex;align-items:center;gap:12px}
.hand li::before{content:"";width:20px;height:20px;border:2px solid var(--ink);border-radius:4px;flex-shrink:0}
.hand li.x{color:#7a7a7a;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.hand li.x::before{background:repeating-linear-gradient(135deg,var(--red) 0 3px,var(--paper) 3px 6px);border-color:var(--red)}
.note-card .tip{margin:14px 0 0;font-family:var(--f-hand);font-size:21px;color:var(--teal);line-height:1.2}
.note-card .tip b{font-family:var(--f-body);font-size:15px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:28px}.note-card{transform:none}}

.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 18px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.2vw,34px);margin:6px 0 0;line-height:1.1}
.sec-h p{color:var(--soft);margin:0;max-width:46ch;font-size:15px}
.book{margin-bottom:30px}
.bookh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bookh .tag{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;background:var(--bc);color:var(--bt);border:var(--bw) solid var(--ink);border-radius:8px;padding:4px 10px}
.bookh h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.bookh .sk{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--soft);color:var(--soft);border-radius:999px;padding:3px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.card{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;cursor:pointer;--shc:var(--bc);transition:transform .12s,box-shadow .12s;min-width:0}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--bc)}
.card .num{font-family:var(--f-display);font-size:26px;line-height:1;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--bc);color:var(--bt);border:var(--bw) solid var(--ink);flex-shrink:0}
.card .ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.card b{font-size:16px;line-height:1.3}
.card .meta{font-size:13px;color:var(--muted)}
.pill{align-self:flex-start;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--ink)}
.pill.ok{background:var(--teal-s)}.pill.go{background:var(--yellow)}
.card.off{background:var(--navy-2);color:var(--soft);border-color:var(--navy-3);box-shadow:none;cursor:default}
.card.off:hover{transform:none;box-shadow:none}
.card.off .num{background:transparent;color:var(--soft);border-color:var(--navy-3)}
.card.off .meta{color:var(--soft);opacity:.8}
.card.off .pill{border-color:var(--navy-3);color:var(--soft);background:transparent}

.loop{background:var(--cream);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--yellow);padding:30px clamp(18px,3vw,36px);margin-block:12px 30px}
.loop h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,38px);line-height:1.1;margin:0 0 6px}
.loop h2 .hl{font-size:.92em}
.loop>p{color:var(--muted);margin:14px 0 22px;max-width:60ch}
.lsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;counter-reset:s}
.lstep{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:16px;padding:16px;position:relative;min-width:0}
.lstep:not(:last-child)::after{content:"→";position:absolute;right:-17px;top:28px;font-weight:700;font-size:18px}
.lstep i{counter-increment:s;width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:14px;background:var(--c);color:var(--t,var(--ink))}
.lstep i::before{content:"0" counter(s)}
.lstep b{display:block;font-size:17px;margin:12px 0 4px}
.lstep span{font-size:14px;color:var(--muted)}
@media (max-width:820px){.lsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.lstep::after{display:none}}
@media (max-width:440px){.lsteps{grid-template-columns:1fr}}

.team{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:34px}
.team .ycard{background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 #000;padding:26px}
.team .ycard .badge{display:inline-block;background:var(--ink);color:var(--yellow);font-size:11px;font-weight:700;letter-spacing:.14em;border-radius:999px;padding:5px 12px}
.team h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3vw,32px);margin:12px 0 16px;line-height:1.1}
.who{display:grid;gap:10px}
.who div{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.who i{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:15px;flex-shrink:0}
.who b{display:block}.who span{font-size:14px;color:var(--muted)}
.team .dcard{background:var(--navy-2);border:2px solid var(--navy-3);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px}
.team .dcard h2 em{font-style:normal;color:var(--teal)}
.team .dcard p{color:var(--soft);margin:0}
.team .dcard ul{margin:0;padding-left:20px;color:var(--soft);display:grid;gap:6px}
@media (max-width:820px){.team{grid-template-columns:1fr}}
.foot{font-size:13px;color:var(--soft);padding-block:6px 30px}

/* oturum */
.sv{padding-block:22px 40px}
.shead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 22px;--shc:var(--bc)}
.shead .big{font-family:var(--f-display);font-size:56px;line-height:1;width:84px;height:84px;border-radius:20px;display:grid;place-items:center;background:var(--bc);color:var(--bt);border:var(--bw) solid var(--ink)}
.shead .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.shead h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.2vw,32px);line-height:1.12;margin:4px 0 10px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600}
.sico{width:120px;height:120px;border:var(--bw) solid var(--ink);border-radius:20px;padding:8px;background:var(--paper)}
.sico svg{width:100%;height:100%;display:block}
@media (max-width:640px){.shead{grid-template-columns:auto minmax(0,1fr)}.shead .big{width:64px;height:64px;font-size:40px;border-radius:16px}.sico{display:none}}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:26px 0 22px}
.tab{display:flex;align-items:center;gap:12px;padding:12px 14px;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--navy-2);color:var(--paper);cursor:pointer;text-align:left;min-width:0;border-color:var(--navy-3)}
.tab .ring{--p:0;width:44px;height:44px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--pc) calc(var(--p)*1%),var(--navy-3) 0);display:grid;place-items:center}
.tab .ring b{width:32px;height:32px;border-radius:50%;background:var(--navy-2);display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.tab .tx{display:flex;flex-direction:column;min-width:0}
.tab small{font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.75}
.tab strong{font-size:16px;line-height:1.2}
.tab[aria-selected="true"]{background:var(--pc);color:var(--ink);border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.tab[aria-selected="true"] .ring{background:conic-gradient(var(--ink) calc(var(--p)*1%),rgba(14,18,34,.2) 0)}
.tab[aria-selected="true"] .ring b{background:var(--pc)}
@media (max-width:620px){.tabs{gap:8px}.tab{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}.tab strong{font-size:14px}}

.panel{padding:22px clamp(16px,3vw,28px);--shc:var(--pc)}
.grp{padding-block:16px;border-bottom:2px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.grp:first-child{padding-top:4px}.grp:last-of-type{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gi{width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);background:var(--ps);display:grid;place-items:center;flex-shrink:0}
.gi svg{width:19px;height:19px}
.gh h4{margin:0;font-size:17px;font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;padding:7px 10px;border-radius:10px;cursor:pointer;max-width:76ch}
.chk:hover{background:var(--ps)}
.chk input{appearance:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;margin:1px 0 0;flex-shrink:0;cursor:pointer;display:grid;place-content:center;background:var(--paper)}
.chk input:checked{background:var(--pc)}
.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked~.lt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pc);text-decoration-thickness:2px}
.lt{flex:1;min-width:0}
.sk{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px;background:var(--skc)}
.pdf{font-size:12px;font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;white-space:nowrap;align-self:center;color:var(--ink);text-decoration:none}
.note{margin:2px 10px;color:var(--muted)}
.prevbox{margin:4px 10px 6px;border:2px dashed var(--ink);border-radius:12px;background:var(--cream);padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 16px;font-size:15px}
.prevbox span{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prevbox p{margin:0}
.warn{margin:2px 10px 8px;background:var(--yellow-s);border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.warn b{flex-shrink:0}
.field{display:flex;flex-direction:column;gap:4px;max-width:76ch;padding:6px 10px}
.field label{font-weight:600;font-size:15px}
.field input{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:9px 12px}
.field input:focus{outline:none;box-shadow:3px 3px 0 var(--pc)}
.nextp{display:flex;justify-content:flex-end;margin-top:16px}
.btn{border:var(--bw) solid var(--ink);border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--bg,var(--paper));color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}
.pfoot{font-size:13px;color:var(--muted);margin:16px 0 0}

/* uygula */
.ubar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:var(--bw) solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:var(--bw) solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.wake{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;margin-left:auto;color:var(--ink)}
.wake input{width:18px;height:18px;accent-color:var(--pink)}
.tl{display:flex;gap:4px;margin:2px 0 6px}
.tl button{border:2px solid var(--ink);border-radius:8px;padding:5px 7px;font-size:12px;cursor:pointer;min-width:0;display:flex;flex-direction:column;line-height:1.15;text-align:left;background:var(--paper);color:var(--ink)}
.tl button b{font-family:var(--f-display);font-weight:400;font-size:15px}
.tl button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl button[aria-current="true"]{background:var(--pink);box-shadow:3px 3px 0 var(--ink)}
.tlnote{font-size:13px;color:var(--muted);margin:0 0 16px}
.stage{border:var(--bw) solid var(--ink);border-radius:20px;background:var(--cream);padding:clamp(18px,3vw,30px)}
.stage .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stage h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.4vw,44px);line-height:1.08;margin:6px 0 14px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;background:var(--paper)}
.tags .t-dk{background:var(--pink)}.tags .t-koc{background:var(--teal-s)}.tags .t-mat{background:var(--yellow-s)}
.key{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px;counter-reset:k}
.key li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(18px,2.4vw,22px);line-height:1.4;font-weight:500}
.key li::before{counter-increment:k;content:counter(k);width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;flex-shrink:0;margin-top:2px}
.more{background:none;border:0;padding:0;margin-top:16px;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:3px;text-underline-offset:4px;cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.nav .btn{min-width:min(46%,220px);font-size:17px;padding:14px 18px}
.nav .nx{--bg:var(--pink)}
.act{border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden;scroll-margin-top:90px}
.act+.act{margin-top:14px}
.acth{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--cream);border-bottom:2px solid var(--ink)}
.acth .an{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--pink);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;flex-shrink:0}
.acth b{flex:1;min-width:0;font-size:17px}
.acth .ok{font-size:13px;font-weight:700}
.act .tags{padding:12px 16px 0}
.act .items{padding:6px 6px 10px}
.act .chk input:checked~.lt{text-decoration:none;color:var(--ink);font-weight:600}
.act .chk:has(input:checked){background:var(--pink-s)}

.done{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:var(--bw) solid var(--ink);border-radius:16px;padding:14px 16px;background:var(--yellow-s)}
.done .btn{--bg:var(--yellow)}
.done.is .btn{--bg:var(--teal)}
.done span{font-size:14px}
.reset{margin-top:12px;border:2px dashed var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.reset h4{margin:0;font-size:16px}
.reset p{margin:0;color:var(--muted);font-size:14px}
.reset label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.reset label input{width:18px;height:18px;accent-color:var(--red)}
.reset .rb{display:flex;gap:10px;flex-wrap:wrap}
.reset .ry{--bg:var(--red);color:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:999px;padding:10px 20px;font-weight:700}
/* bilgi bandı */
.info{padding-block:22px 0}
.info .wrap{background:var(--navy-2);border:2px solid var(--navy-3);border-radius:20px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.info h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:6px 0 6px;line-height:1.2}
.info p{margin:0;color:var(--soft);font-size:14.5px}
.info .m{border:2px solid var(--navy-3);border-radius:14px;padding:12px 14px;background:var(--navy)}
.info .m b{display:inline-block;font-size:13px;font-weight:700;color:var(--ink);background:var(--mc);border:2px solid var(--ink);border-radius:8px;padding:1px 9px;margin-bottom:6px}
@media (max-width:900px){.info .wrap{grid-template-columns:1fr}}
.pbtn{--bg:var(--yellow);display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:9px 14px}
.pbtn svg{width:18px;height:18px}
.selc{font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;background:var(--pink-s);color:var(--ink)}
.uhint{font-size:14px;color:var(--muted);margin:-4px 0 14px;max-width:80ch}
.ubar .pbtn{margin-left:auto}
.ubar .wake{margin-left:0}

/* yazdırma: A4 seans planı */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm 12mm 14mm}
  html,body{background:#fff!important;color:#000}
  body::before{display:none}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:var(--f-body);font-size:10.5pt;line-height:1.35;color:#000}
  .pr-h{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px}
  .pr-h img{height:30px}
  .pr-h div{flex:1}
  .pr-h small{display:block;font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase}
  .pr-h strong{font-family:var(--f-display);font-weight:400;font-size:15pt;line-height:1.15}
  .pr-h .n{font-family:var(--f-display);font-size:24pt;border:2px solid #000;border-radius:8px;padding:0 10px}
  .pr-f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 16px;margin:8px 0 4px;font-size:9.5pt}
  .pr-f span{border-bottom:1px solid #000;padding-bottom:2px}
  .pr-sec{margin-top:9px;break-inside:avoid}
  .pr-sec h3{font-size:9pt;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px;border-bottom:1px solid #999;padding-bottom:2px}
  .pr-sec p{margin:2px 0}
  .pr-act{margin:5px 0 2px;break-inside:avoid}
  .pr-act .t{font-weight:700}
  .pr-act .t em{font-style:normal;font-weight:400;font-size:9pt}
  .pr-box{display:flex;gap:7px;align-items:flex-start;margin:2px 0 2px 14px}
  .pr-box::before{content:"";width:10px;height:10px;border:1.3px solid #000;border-radius:2px;flex-shrink:0;margin-top:3px}
  .pr-line{border-bottom:1px solid #999;height:18px}
  .pr-foot{margin-top:10px;font-size:8pt;color:#444;border-top:1px solid #999;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover,.btn:hover{transform:none}}

        </div></div>
    </section>
    <p class="foot">İşaretler ve notlar sunucuya gönderilmez; yalnızca bu cihazdaki tarayıcıda saklanır.</p>
  </div></main>`;
  try{history.replaceState(null,"","#ana")}catch(e){}
}

function item(id,x,p){const on=st(id)?"checked":"";const t=txt(x),e=Array.isArray(x)?x[1]:null,u=Array.isArray(x)?x[2]:null;
  return `<label class="chk"><input type="checkbox" data-k="${id}" ${on}><span class="lt">${t}${e&&e!=="pdf"?sk(e):""}</span>${e==="pdf"&&u?`<a class="pdf" href="${u}" target="_blank" rel="noopener">PDF</a>`:""}</label>`}

function resetHTML(n){
  if(!st(`s${n}done`)||noReset[n])return "";
  return `<div class="reset"><h4>Seans bitti. Başka bir seans için işaretler kaldırılsın mı?</h4>
  <p>Aynı oturumu başka bir çocukla uygulayacaksan işaretleri temizle. Bu oturumdaki bütün işaretler ve "tamamlandı" durumu silinir.</p>
  <label><input type="checkbox" id="rNotes"> Kayıt alanlarındaki notları da sil (bir sonraki oturumda görünmez)</label>
  <div class="rb"><button type="button" class="btn ry" data-reset="yes">Evet, temizle</button><button type="button" class="btn" data-reset="no">Hayır</button></div></div>`}

function groups(n,p){
  const P=DATA[n].phases[p];let h="";
  P.forEach((b,bi)=>{const base=`s${n}p${p}b${bi}`;
    if(b.a)return;
    if(b.done){const d=st(`s${n}done`);h+=`<div class="done ${d?'is':''}"><button type="button" class="btn" id="doneBtn">${d?"✓ Seans tamamlandı":"Seansı tamamlandı olarak işaretle"}</button><span>${d?"Bu işaret yalnızca bu cihazda görünür.":"Bütün maddeleri bitirdiğinde işaretle."}</span></div>`+resetHTML(n);return}
    h+=`<div class="grp"><div class="gh"><span class="gi">${ICON[b.ic]||""}</span><h4>${b.g}</h4></div>`;
    if(b.note)h+=`<p class="note">${b.note}</p>`;
    if(b.prev){const v=b.pf.map(f=>[f[1],st(`s${b.prev}f${f[0]}`)]);h+=`<div class="prevbox">${v.some(x=>x[1])?v.map(x=>`<div><span>${x[0]}</span><b>${x[1]?esc(x[1]):"—"}</b></div>`).join(""):`<p>${b.prev}. Oturumda bu cihazda not kaydedilmedi.</p>`}</div>`}
    if(b.i)h+=b.i.map((x,i)=>item(base+"i"+i,x)).join("");
    if(b.f){h+=`<div class="warn"><b>Dikkat:</b><span>Çocuğun ya da ailenin adını, kimlik bilgisini yazma; kısaltma kullan (ör. "Koç: anne"). Notlar yalnızca bu cihazda saklanır, ortak bilgisayarda başkaları görebilir.</span></div>`;
      h+=b.f.map(f=>`<div class="field"><label for="f${n}${f[0]}">${f[1]}</label><input id="f${n}${f[0]}" data-f="s${n}f${f[0]}" autocomplete="off" value="${esc(st(`s${n}f${f[0]}`)||"")}"></div>`).join("")}
    h+=`</div>`});
  return h}

function apply(n){
  const P=DATA[n].phases[1],acts=P.map((b,bi)=>[b,bi]).filter(x=>x[0].a);
  if(curA>=acts.length)curA=0;
  const tl=`<div class="tl" aria-label="Oturum akışı">${acts.map(([b],i)=>`<button type="button" data-act="${i}" style="flex:${b.dk}" title="${esc(b.t)}" aria-current="${uMode==="seans"&&i===curA}"><b>${b.a}</b><span>${b.dk} dk</span></button>`).join("")}</div><p class="tlnote">Süreler kesin değil, tahmini öneridir.</p>`;
  const tags=b=>`<div class="tags"><span class="t-dk">${b.dk} dk</span>${b.mat?`<span class="t-mat">Materyal: ${b.mat}</span>`:""}${b.koc?`<span class="t-koc">${b.koc}</span>`:""}<span>Kılavuz ${b.ref}</span></div>`;
  const nSel=keys(n,1).filter(k=>st(k)).length;
  const bar=`<div class="ubar"><div class="seg" role="group" aria-label="Görünüm"><button type="button" data-um="seans" aria-pressed="${uMode==="seans"}">Seans modu</button><button type="button" data-um="liste" aria-pressed="${uMode==="liste"}">Ayrıntılı liste</button></div><span class="selc" id="selc">${nSel} madde seçildi</span>${"wakeLock" in navigator?`<label class="wake"><input type="checkbox" id="wakeT" ${wakeLock?"checked":""}> Ekran açık kalsın</label>`:""}<button type="button" class="btn pbtn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>Yazdır / PDF olarak kaydet</button></div>
  <p class="uhint">${uMode==="liste"?"Seansta hatırlatıcı olarak kullanmak istediğin maddeleri seç. Yalnızca seçtiklerin, başında boş kutuyla seans planına aktarılır.":"Akışın özeti. Seans planına madde eklemek için Ayrıntılı liste'ye geç."} Yazdır penceresinde hedef olarak "PDF olarak kaydet"i seçebilirsin.</p>`;
  let body="";
  if(uMode==="seans"){
    const [b]=acts[curA],ki=(KEY[n]&&KEY[n][b.a])||[0];
    body=`<article class="stage" aria-live="polite"><div class="k">Etkinlik ${b.a} / ${acts.length}</div><h2>${b.t}</h2>${tags(b)}
      <ol class="key">${ki.map(i=>b.i[i]).filter(Boolean).map(x=>`<li>${txt(x)}</li>`).join("")}</ol>
      <button class="more" type="button" data-full="a${b.a}">Bu etkinliğin ayrıntılı listesi (${b.i.length} madde)</button></article>
      <div class="nav"><button class="btn" type="button" data-step="-1" ${curA===0?"disabled":""}>← Önceki</button><button class="btn nx" type="button" data-step="1" ${curA===acts.length-1?"disabled":""}>${curA===acts.length-1?"Son etkinlik":"Sonraki →"}</button></div>`;
  }else{
    body=acts.map(([b,bi])=>{const base=`s${n}p1b${bi}`,ks=b.i.map((_,i)=>base+"i"+i),dn=ks.filter(k=>st(k)).length;
      return `<article class="act" id="a${b.a}"><div class="acth"><span class="an">${b.a}</span><b>${b.t}</b><span class="ok" data-ok="${base}">${dn}/${ks.length} seçili</span></div>${tags(b)}<div class="items">${b.i.map((x,i)=>item(base+"i"+i,x)).join("")}</div></article>`}).join("");
  }
  return bar+tl+body}

function session(n,p=0){
  curS=n;curP=p;
  const s=SESS[n-1],bi=s[1],b=BOOKS[bi],D=DATA[n];
  $("home").hidden=false;
  const tabs=PH.map((ph,i)=>`<button class="tab" role="tab" type="button" data-ph="${i}" aria-selected="${i===p}" style="${pv(i)}"><span class="ring" style="--p:${pct(n,i)}"><b>${i+1}</b></span><span class="tx"><small>BÖLÜM ${i+1}</small><strong>${ph.t}</strong></span></button>`).join("");
  const inner=p===1?apply(n):groups(n,p);
  const nxt=p<2?`<div class="nextp"><button class="btn" type="button" data-ph="${p+1}" style="--bg:var(--${PH[p+1].c})">Sonraki: ${PH[p+1].t} →</button></div>`:"";
  $("view").innerHTML=`<main class="sv gut"><div class="wrap">
    <section class="shead paper" style="${bv(bi)}"><span class="big">${n}</span><div style="min-width:0"><div class="k">${b.tag} · ${s[3]}</div><h1>${s[2]}</h1><div class="facts">${D.facts.map(f=>`<span>${f}</span>`).join("")}</div></div>${SICON[n]?`<span class="sico">${SICON[n]}</span>`:""}</section>
    <div class="tabs" role="tablist">${tabs}</div>
    <section class="panel paper" style="${pv(p)}">${inner}${nxt}<p class="pfoot">İşaretler ve notlar yalnızca bu cihazda saklanır.</p></section>
  </div></main>`;
  try{history.replaceState(null,"","#oturum-"+n)}catch(e){}
}
function printPlan(n){
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n],P=D.phases;
  const plain=x=>txt(x);
  const g0=P[0].filter(x=>(x.ic==="print"||x.ic==="box")&&x.i);
  const take=g0.map(g=>`<p><b>${g.g}:</b> ${g.i.map(plain).join(" · ")}</p>`).join("");
  const pg=P[0].find(x=>x.prev);
  let prev="";
  if(pg){const v=pg.pf.map(f=>[f[1],st(`s${pg.prev}f${f[0]}`)]).filter(x=>x[1]);prev=`<div class="pr-sec"><h3>${pg.prev}. Oturumdan gelen</h3>${v.length?v.map(x=>`<p>${x[0]}: <b>${esc(x[1])}</b></p>`).join(""):""}${(pg.i||[]).map(x=>`<div class="pr-box">${plain(x)}</div>`).join("")}</div>`}
  const acts=P[1].map((x,bi)=>[x,bi]).filter(x=>x[0].a);
  const flow=acts.map(([a,bi])=>{const sel=a.i.map((x,i)=>[x,i]).filter(([x,i])=>st(`s${n}p1b${bi}i${i}`));
    return `<div class="pr-act"><div class="t">${a.a}. ${a.t} <em>· ${a.dk} dk · Kılavuz ${a.ref}${a.koc?" · "+a.koc:""}${a.mat?" · "+a.mat:""}</em></div>${sel.map(([x])=>`<div class="pr-box">${plain(x)}</div>`).join("")}</div>`}).join("");
  const after=P[2].filter(x=>x.i&&!x.f&&x.ic!=="form").map(g=>`<p><b>${g.g}:</b> ${g.i.map(plain).join(" ")}</p>`).join("");
  const sv=P[2].find(x=>x.f);
  const fields=sv?sv.f.map(f=>`<span>${f[1]}: </span>`).join(""):"";
  $("print").innerHTML=`<div class="pr-h"><img src="${document.querySelector('.logo img').src}" alt=""><div><small>Seans planı · ${b.tag} · ${s[3]}</small><strong>${s[2]}</strong></div><span class="n">${n}</span></div>
   <div class="pr-f"><span>Tarih:</span><span>Çocuk kodu:</span><span>Koç:</span></div>
   <div class="pr-sec"><h3>Seanstan önce · yanına al</h3>${take}</div>${prev}
   <div class="pr-sec"><h3>Seans akışı (süreler tahminidir)</h3>${flow}</div>
   <div class="pr-sec"><h3>Seans sonrası</h3>${after}${fields?`<div class="pr-f" style="grid-template-columns:1fr">${fields}</div>`:""}</div>
   <div class="pr-sec"><h3>Notlar</h3><div class="pr-line"></div><div class="pr-line"></div><div class="pr-line"></div></div>
   <p class="pr-foot">Simon Says · Seans Rehberim · ${n}. Oturum. Ayrıntılar için basılı Uygulama Kılavuzu'na bakınız.</p>`;
  try{window.print()}catch(e){}
}
function refresh(){
  document.querySelectorAll(".tab").forEach((t,i)=>t.querySelector(".ring").style.setProperty("--p",pct(curS,i)));
  document.querySelectorAll("[data-ok]").forEach(el=>{const a=[...document.querySelectorAll(`[data-k^="${el.dataset.ok}i"]`)];el.textContent=a.filter(x=>x.checked).length+"/"+a.length+" seçili"});
  const sc=$("selc");if(sc)sc.textContent=keys(curS,1).filter(k=>st(k)).length+" madde seçildi";
}
function clearSession(n,notes){
  const re=new RegExp(`^s${n}(p\\d|q\\d|done${notes?"|f":""})`);
  Object.keys(mem).forEach(k=>{if(re.test(k))delete mem[k]});
  try{Object.keys(localStorage).forEach(k=>{if(k.startsWith("ssr:")&&re.test(k.slice(4)))localStorage.removeItem(k)})}catch(e){}
}
function toast(m){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function setWake(on){
  if(on){try{wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null;const w=$("wakeT");if(w)w.checked=false})}catch(e){wakeLock=null;const w=$("wakeT");if(w)w.checked=false;toast("Bu tarayıcı ekranı açık tutmaya izin vermedi")}}
  else relWake()}
function relWake(){if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}}
const top0=()=>window.scrollTo({top:0});
const toPanel=()=>{const t=document.querySelector(".tabs");if(t)t.scrollIntoView({block:"start"})};

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-s]");if(c){curA=0;uMode="seans";session(+c.dataset.s);top0();return}
  const t=e.target.closest("[data-ph]");if(t){session(curS,+t.dataset.ph);toPanel();return}
  const um=e.target.closest("[data-um]");if(um){uMode=um.dataset.um;session(curS,1);return}
  const a=e.target.closest("[data-act]");if(a){if(uMode==="seans"){curA=+a.dataset.act;session(curS,1)}else{const el=document.querySelectorAll(".act")[+a.dataset.act];if(el)el.scrollIntoView({block:"start"})}return}
  const s=e.target.closest("[data-step]");if(s){curA+=+s.dataset.step;session(curS,1);toPanel();return}
  const f=e.target.closest("[data-full]");if(f){uMode="liste";session(curS,1);const el=$(f.dataset.full);if(el)el.scrollIntoView({block:"start"});return}
  const r=e.target.closest("[data-reset]");if(r){const n=curS;
    if(r.dataset.reset==="yes"){const notes=$("rNotes")&&$("rNotes").checked;clearSession(n,notes);curA=0;session(n,0);top0();toast(notes?"İşaretler ve notlar temizlendi":"İşaretler temizlendi")}
    else{noReset[n]=true;r.closest(".reset").remove()}return}
  if(e.target.closest("#printBtn")){if(!keys(curS,1).some(k=>st(k)))toast("Henüz madde seçmedin; plan yalnızca akışla yazdırılır");printPlan(curS);return}
  if(e.target.id==="doneBtn"){const k=`s${curS}done`;put(k,!st(k));delete noReset[curS];session(curS,curP);return}
});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k){put(k,e.target.checked);refresh();return}if(e.target.id==="wakeT")setWake(e.target.checked)});
document.addEventListener("input",e=>{if(e.target.dataset.f)put(e.target.dataset.f,e.target.value)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&$("wakeT")&&$("wakeT").checked&&!wakeLock)setWake(true)});
$("home").onclick=()=>{home();top0()};
$("brand").onclick=()=>{home();top0()};
const m=location.hash.match(/^#oturum-(\d+)$/);
if(m&&DATA[+m[1]])session(+m[1]);else home();
</script>
</body>
</html>
