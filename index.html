<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Simon Says Seans Rehberim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: brand bar → hero with Simon → colour-banded book sections of session cards.
   Session view: book-coloured header band → three phase tabs (each phase has its own guide colour) → checklist panel. */
:root{
  --bg:#F4F7F7; --surface:#FFFFFF; --ink:#1E2427; --muted:#56636A; --line:#D7E0E2;
  --teal:#1F6F7A; --teal-d:#15525A; --teal-s:#EAF4F5;
  --rust:#B8521C; --rust-d:#8A3B12; --rust-s:#FDF1E9;
  --plum:#8A3C8C; --plum-d:#6A2A6C; --plum-s:#F5ECF5;
  --blue:#2E5C9A; --blue-s:#E8EEF7;
  --slate:#56636A; --slate-s:#EEF1F2;
  --on:#FFFFFF;
  --f-display:'Lexend',system-ui,sans-serif; --f-body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111719; --surface:#192124; --ink:#E5EBED; --muted:#9AA7AD; --line:#2A363A;
  --teal:#3E9AA6; --teal-d:#5FB3BE; --teal-s:#16302F;
  --rust:#C9642C; --rust-d:#E58A55; --rust-s:#33221A;
  --plum:#9E52A0; --plum-d:#C98BCB; --plum-s:#2E2030;
  --blue:#4A7BBE; --blue-s:#1C2636; --slate:#6F7C82; --slate-s:#222B2E; --on:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#192124; --ink:#E5EBED; --muted:#9AA7AD; --line:#2A363A;
  --teal:#3E9AA6; --teal-d:#5FB3BE; --teal-s:#16302F;
  --rust:#C9642C; --rust-d:#E58A55; --rust-s:#33221A;
  --plum:#9E52A0; --plum-d:#C98BCB; --plum-s:#2E2030;
  --blue:#4A7BBE; --blue-s:#1C2636; --slate:#6F7C82; --slate-s:#222B2E; --on:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
.stripe{height:5px;background:linear-gradient(90deg,var(--teal) 0 25%,var(--rust) 25% 50%,var(--plum) 50% 75%,var(--blue) 75%)}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo{height:40px;width:auto;display:block}
:root[data-theme="dark"] .logo{filter:brightness(1.9) saturate(.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(1.9) saturate(.8)}}
.brand .sr{border-left:1.5px solid var(--line);padding-left:10px}
@media (max-width:480px){.bar .wrap{flex-wrap:nowrap;gap:8px}.logo{height:34px}.brand .sr{font-size:15px;padding-left:8px;white-space:nowrap}.back{padding:6px 11px;font-size:13px;white-space:nowrap}}
.brand .ss{font-family:var(--f-display);font-weight:700;font-size:18px}
.brand .sr{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--teal-d)}
.back{margin-left:auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-family:var(--f-display);font-size:14px;font-weight:600;cursor:pointer}
.back:hover{border-color:var(--teal);color:var(--teal)}

/* hero */
.hero{background:var(--teal-s)}
.hero .wrap{display:flex;align-items:center;gap:24px;padding-block:22px}
.hero img{width:min(240px,34vw);height:auto;flex-shrink:0;mix-blend-mode:multiply}
:root[data-theme="dark"] .hero img{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero img{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:6px}}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.hero h1 span{color:var(--teal-d)}
.hero p{margin:0;max-width:56ch;color:var(--muted)}
.phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.phases span{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:14px;background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px}
.phases b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--on);font-size:13px}
@media (max-width:560px){.hero .wrap{flex-direction:column;align-items:flex-start}.hero img{width:180px}}

main{padding-block:8px 64px}
.book{margin-top:26px}
.bookh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bc);color:var(--on);border-radius:14px;padding:10px 16px;margin-bottom:12px}
.bookh .tag{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.bookh h2{font-family:var(--f-display);font-size:19px;margin:0}
.bookh .sk{font-size:14px;opacity:.9;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.card{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--bc);border-radius:14px;padding:14px;cursor:pointer;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,40,45,.10)}
.num{width:40px;height:40px;border-radius:12px;background:var(--bs);color:var(--bc);font-family:var(--f-display);font-weight:700;font-size:19px;display:grid;place-items:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.card.ready .num{background:var(--bc);color:var(--on)}
.ct{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct b{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.3}
.ct .meta{font-size:13px;color:var(--muted)}
.pill{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:2px}
.pill.pend{background:var(--slate-s);color:var(--muted)}
.pill.ready{background:var(--bc);color:var(--on)}
.pill.doneP{background:var(--teal-s);color:var(--teal-d)}

/* session */
.shead{border-radius:18px;padding:20px 22px;color:var(--on);background:var(--bc);margin-top:18px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.shead.multi{background:linear-gradient(120deg,var(--teal-d),var(--teal) 55%,var(--blue))}
.shead .big{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.9;opacity:.95}
.shead .k{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.shead h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,30px);line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:600}
.sico{width:132px;height:132px;margin-left:auto;background:#FFFFFF;border-radius:22px;padding:10px;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sico svg{width:100%;height:100%;display:block}
@media (max-width:640px){.shead{flex-wrap:wrap}.sico{width:88px;height:88px;padding:6px;border-radius:16px}.shead .big{font-size:48px}}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0}
.tab .ring{--p:0;width:42px;height:42px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--pc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.tab .ring b{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.tab .tx{display:flex;flex-direction:column;min-width:0}
.tab .tx small{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tab .tx strong{font-family:var(--f-display);font-size:16px;line-height:1.2}
.tab .tx em{font-style:normal;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--pc);background:var(--ps)}
@media (max-width:620px){.tabs{gap:6px}.tab{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}.tab .tx strong{font-size:14px}.tab .tx em{display:none}}

.panel{background:var(--surface);border-radius:18px;padding:18px 20px;border:1px solid var(--line);border-top:5px solid var(--pc)}
.lead{display:flex;gap:10px;align-items:center;background:var(--ps);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-weight:600}
.grp{display:flex;flex-direction:column;gap:2px;padding-block:12px;border-bottom:1px dashed var(--line)}
.grp:last-of-type{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.gi{width:34px;height:34px;border-radius:10px;background:var(--ps);color:var(--pc);display:grid;place-items:center;flex-shrink:0}
.gi svg{width:19px;height:19px}
.gh h4{font-family:var(--f-display);font-size:16px;margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:7px 10px;border-radius:10px;max-width:74ch}
.chk:hover{background:var(--ps)}
.chk input{appearance:none;width:24px;height:24px;border:2px solid var(--pc);border-radius:7px;flex-shrink:0;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.chk input:checked{background:var(--pc)}
.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked ~ .lt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.lt{flex:1;min-width:0}
.pdf{font-size:12px;font-weight:700;color:var(--rust);background:var(--rust-s);border-radius:999px;padding:2px 10px;white-space:nowrap;align-self:center}
.sk{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px;color:var(--on)}
.note{margin:2px 10px;color:var(--muted)}
.prevbox{margin:4px 10px 6px;border-radius:12px;background:var(--ps);padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 16px;font-size:15px}
.prevbox span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.prevbox b{font-weight:600}

/* timeline */
.tl{display:flex;gap:3px;border-radius:12px;overflow:hidden;margin:2px 0 14px}
.tl button{border:0;color:var(--on);font-family:var(--f-display);font-size:12px;padding:6px 8px;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.tl b{font-size:15px}
.tl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:90px}
.act + .act{margin-top:12px}
.acth{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--as)}
.acth .an{width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--on);font-family:var(--f-display);font-weight:700;display:grid;place-items:center;flex-shrink:0}
.acth b{font-family:var(--f-display);font-size:17px;flex:1;min-width:0}
.acth .ok{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--ac)}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;padding:10px 16px 0}
.tags span{border-radius:999px;padding:2px 10px;font-weight:600;background:var(--slate-s);color:var(--muted)}
.tags .t-dk{background:var(--ac);color:var(--on)}
.tags .t-mat{background:var(--rust-s);color:var(--rust-d)}
.tags .t-koc{background:var(--blue-s);color:var(--blue)}
.act .items{padding:6px 6px 10px}
.act .chk input{border-color:var(--ac)} .act .chk input:checked{background:var(--ac)} .act .chk:hover{background:var(--as)}

.field{display:flex;flex-direction:column;gap:4px;max-width:74ch;padding:6px 10px}
.field label{font-weight:600;font-size:15px}
.field input{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--pc);outline:none}
.done{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:16px;padding:14px 16px;background:var(--ps)}
.done button{border:0;background:var(--pc);color:var(--on);border-radius:12px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer}
.done.is button{background:var(--teal)}
.foot{font-size:13px;color:var(--muted);margin-top:14px}
.empty{display:flex;flex-direction:column;gap:6px;max-width:60ch}
.empty h3{font-family:var(--f-display);margin:0;font-size:19px}
.nextp{display:flex;justify-content:flex-end;margin-top:14px}
.nextp button{border:0;background:var(--pn);color:var(--on);border-radius:12px;padding:11px 18px;font-family:var(--f-display);font-weight:600;cursor:pointer}
/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink);font:inherit}
.mode:hover{border-color:var(--bc);background:var(--bs)}
.mode .ml{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.mode strong{font-family:var(--f-display);font-size:21px;line-height:1.2;color:var(--bc)}
.mode p{margin:0;color:var(--muted)}
.mode .mi{width:44px;height:44px;border-radius:12px;background:var(--bs);color:var(--bc);display:grid;place-items:center}
.mode .mi svg{width:24px;height:24px}
.mode .go{margin-top:auto;font-family:var(--f-display);font-weight:600;color:var(--bc)}
.mode[disabled]{cursor:not-allowed;opacity:.6}.mode[disabled]:hover{border-color:var(--line);background:var(--surface)}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--slate-s);border-radius:999px;padding:4px;gap:4px;margin:16px 0 4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--bc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[disabled]{cursor:not-allowed;opacity:.5}
.qp{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 20px 16px;margin-top:12px}
.qs{padding:14px 0;border-bottom:1px dashed var(--line)}
.qs:last-of-type{border-bottom:0}
.qs h3{margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qs h3 .qh{display:inline-flex;align-items:center;gap:9px;background:var(--qc);color:var(--on);border-radius:12px;padding:8px 14px 8px 10px;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.qs h3 .qh i{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal}
.qs h3 .qh svg{width:18px;height:18px}
.qs h3 .more{margin-left:auto}
.qs .chk input{border-color:var(--qc)}.qs .chk input:checked{background:var(--qc)}.qs .chk:hover{background:var(--qs)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 10px 8px}
.chips span{background:var(--slate-s);border-radius:999px;padding:3px 11px;font-size:14px}
.chips span.pd{background:var(--rust-s);color:var(--rust-d);font-weight:600}
.qrow{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border-radius:12px}
.qrow:hover{background:var(--qs)}
.qrow .chk{padding:0;flex:1}
.qrow .dk{font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--qc);color:var(--on);border-radius:999px;padding:2px 9px;white-space:nowrap}
.qmeta{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.more{border:0;background:none;color:var(--qc);font-weight:600;font-size:14px;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.qnote{margin:4px 10px;color:var(--muted);font-size:15px}
.qflow{font-family:var(--f-display);font-size:14px;color:var(--muted);margin:0 10px 6px}
.qflow em{font-family:var(--f-body,inherit);font-style:normal;font-size:13px;background:var(--slate-s);border-radius:999px;padding:2px 10px;margin-left:8px;display:inline-block}
.tlnote{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.backq{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;border:0;background:var(--rust);color:var(--on);border-radius:999px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.backq:hover{background:var(--rust-d)}
body:has(#backQ) #view{padding-bottom:84px}
.reset{margin-top:12px;border:2px dashed var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.reset h4{font-family:var(--f-display);font-size:16px;margin:0}
.reset p{margin:0;color:var(--muted);font-size:15px}
.reset .rb{display:flex;gap:10px;flex-wrap:wrap}
.reset .rb button{border:0;border-radius:12px;padding:10px 22px;font-family:var(--f-display);font-weight:600;font-size:15px;cursor:pointer}
.reset .ry{background:var(--rust);color:var(--on)}
.reset .rn{background:var(--slate-s);color:var(--ink)}
.reset label{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.reset label input{width:18px;height:18px;accent-color:var(--rust)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--teal-d);color:#fff;border-radius:999px;padding:11px 20px;font-family:var(--f-display);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media (max-width:620px){.qrow{flex-wrap:wrap}.qrow .more{margin-left:36px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>

   [ {g:"Randevuda",ic:"phone",i:["Aileden çocuksuz gelmesini iste; mümkünse iki ebeveyn birlikte gelsin.","Hikâyeyi önceden verme. \"Bir annenin hikâyesi üzerinden konuşacağız\" demen yeterli."]},

     {g:"Önceki oturumdan gelen",ic:"back",note:"Yok, bu programın ilk oturumu."} ],
   [ {a:1,t:"Karşılama",dk:5,ref:"s. 2",i:["\"Evde sizi en çok ne yoruyor?\" diye sor.","Ailenin kullandığı kelimeleri aynen not et.","Bu aşamada çözüm önerme; dinle ve özetle."]},
     {a:2,t:"Can'ın Hikâyesi",dk:30,ref:"s. 3–5 · okuma metni s. 11–12",mat:"Okuma metni",i:["Her sahnede: oku → aynalama sorusunu sor → ailenin örneğini dinle → beceriye ad ver.",["Sahne 1 · Pijamalı Can","CB"],["Sahne 2 · \"Bu çocuk şımarık\""],["Sahne 3 · Annenin akşamı","ALL"],["Sahne 4 · Video oyunu ve cepteki liste"],["Sahne 5 · Bilek listesi"],"\"Bu tam bizim çocuk\" cümlesini duyarsan aynen not et."]},
     {a:3,t:"Beyin Becerileri Haritası",dk:8,ref:"s. 6",mat:"Görsel ve harita",i:["Simon'un Dört Beyin Becerisi görselini göster.","\"Bizim evde\" sütununu ailenin kelimeleriyle doldur.","Güçlü yanlar satırını mutlaka doldur."]},
     {a:4,t:"Programı tanıt: Siz Koçsunuz",dk:7,ref:"s. 7",mat:"Çalışma Kitapları 1–4",i:["\"Siz Koçsunuz\" mesajını ver.","Kitapları masaya koy.","Koçun iki kuralını anlat.","Koçu belirle ve adını forma yaz."]},
     {a:5,t:"Beceri Kontrol Kartları",dk:5,ref:"s. 8",mat:"4 Beceri Kontrol Kartı",i:["Kartları yan yana diz.","Her kartı hikâyeye bağla.","\"Hangi kart en çok işimize yarar?\" diye sor, cevabı forma yaz."]},
     {a:6,t:"Kapanış",dk:3,ref:"s. 9",i:["Dört temel mesajı söyle.","Ev görevini ver.","Çocuğa söylenecek cümleyi yaşına göre seç (6–8 ya da 9–12)."]} ],
   [ {g:"Aileye ver",ic:"hand",i:["Beceri Anları Kayıt Sayfası (3 an; en az biri başarı anı olsun)","Çocuğa söylenecek cümle"]},
     {g:"Formu doldur",ic:"form",i:["Uygulayıcı Notları: öne çıkan beceriler, tanıma cümlesi, hedef adayı ve seçilen kart.","Koç Raporu bu hafta doldurulmaz; aileye yalnızca gösterilir."]},

2:{
  facts:["≈ 50 dk","Uygulayıcı ve çocuk","Koç açılışta ve kapanışta"],
  phases:[
   [ {g:"Kendin için",ic:"book",i:["Simon'un Hikâyesi'ni (ÇK Giriş s. 32–42) iki kez sesli oku; Simon'un sesiyle anlatmayı dene.","Üç durağı (s. 33, 34, 35) ve dört beceri sayfasını (s. 38–41) işaretle."]},
     {g:"Koçla",ic:"phone",i:["Koçun getirdiği Beceri Anları Kayıt Sayfası'nı çocuk odaya girmeden oku; bir \"başarı anı\" seç.","Koçun oturum sırasında bekleyeceği yeri ayarla."]},
     {g:"Yazdır",ic:"print",i:[["Peki Ya Sen? çalışma sayfası (ÇK s. 45)","pdf"],["Oturum Değerlendirme ve Takip Formu","pdf"]]},
     {g:"Masaya",ic:"box",i:["Simon'un Hikâyesi (ÇK Giriş s. 32–42)","Simon'un Dört Beyin Becerisi görseli (s. 36)","Yürütücü İşlevler Kontrol Listem (s. 43–44)","Boş kâğıt, kalem, boya kalemleri","Beceri Kontrol Kartları (isteğe bağlı)"]},
     {g:"1. Oturumdan gelen",ic:"back",prev:1,pf:[["koc","Koçun adı"],["kart","Ailenin seçtiği kart"],["hedef","Hedef adayı"]],i:["Ailenin getirdiği Beceri Anları Kayıt Sayfası","1. Oturumda doldurulan Beyin Becerileri Haritası"]} ],
   [ {a:1,t:"Karşılama: Koçla birlikte",dk:5,ref:"s. 2",koc:"Koç odada",i:["Çocuğu ve Koçu birlikte karşıla.","Koçtan seçtiğin başarı anını çocuğun yanında anlatmasını iste. Zorlanılan anlar konuşulmaz.","Koça teşekkür et; dışarıda bekleyeceğini ve sonunda döneceğini çocuğun duyacağı biçimde söyle."]},
     {a:2,t:"Simon'la tanışma",dk:3,ref:"s. 3",mat:"Simon'un resmi (ÇK s. 32)",i:["Simon'un kaykaylı resmini göster ve Simon'u tanıt.","Sınav olmadığını, yanlış cevabın da olmadığını söyle.","Hikâyeyi Simon'un ağzından, \"ben\" diliyle anlat."]},
     {a:3,t:"Simon'un Hikâyesi: Ben neden yapamıyordum?",dk:10,ref:"s. 4",mat:"ÇK s. 33–35",i:[["Durak 1 · Simon'un dört sorunu: \"Hangisi sana en tanıdık geldi?\" Cevabı not et.","ALL"],"Durak 2 · \"Belki de beceriksiz biriyim\": \"Sence Simon beceriksiz mi?\"","Durak 3 · Oyun tahtası: kâğıda BAŞLA, BİTİŞ ve kıvrımlı bir yol çiz.","Çizimi sakla; Etkinlik 6'da kullanılacak."]},
     {a:4,t:"Simon'un dört beyin becerisi",dk:15,ref:"s. 5–6",mat:"ÇK s. 36–42",i:["Görseli göster; kısa adları söyle: Hatırlama, Durdurma, Değiştirme, Planlama.",["Hatırlama (s. 38): ipucu aracı ve köprü sorusu","CB"],["Durdurma (s. 39): durma oyunları ve köprü sorusu","TE"],["Değiştirme (s. 40): isterse bir kez yavaş nefes, köprü sorusu","BE"],["Planlama (s. 41): oyun tahtasıyla bağla, köprü sorusu","SO"],"Çocuğun Durak 1'de seçtiği becerinin üzerinde daha uzun dur.","Hikâyenin sonu (s. 42): \"Hangisi senin işine en çok yarardı?\" Cevabı not et."]},
     {a:5,t:"Simon'un Kontrol Listesi",dk:4,ref:"s. 7",mat:"ÇK s. 43–44",i:["Sayfayı Simon'un yol haritası olarak göster; doldurulmaz.","Üç yolu hikâyeden bir örnekle bağla: becerileri uygula, araç kullan, yardım iste."]},
     {a:6,t:"Peki Ya Sen?",dk:7,ref:"s. 7",mat:"Peki Ya Sen? (ÇK s. 45)",i:["Küçük, somut ve bu hafta denenebilir bir amaç yazın.","Bir beceriyi daire içine alın.","Kontrol listesinden bir yol seçip nasıl yapacağını yazın.","Amaç büyükse küçültün: \"Bu hafta onun küçük bir parçası ne olabilir?\""]},
     {a:7,t:"Kapanış: Koç geri döner",dk:6,ref:"s. 8",koc:"Koç geri döner",i:["Koçu içeri al; çocuk Simon'u ve amacını Koça anlatsın.","\"Bir Şey Daha Var!\": Koçla kontrol zamanını belirleyin (tarih, saat, yer).","Koça rolünü söyle: o anda yanında olsun, \"Nasıl gitti?\" diye sorsun; puan vermesin.","Sayfadaki üç mesajı çocuğa oku.","Bravo, Başardın!: çabayı ve dürüstlüğü adlandır."]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Peki Ya Sen? sayfası eve gider; amacın yaşandığı yere asılır (kapı, buzdolabı).","Koça hatırlat: Koç Raporu'nda Görev 1 kontrol zamanında çocukla birlikte işaretlenecek (−2 ile +2)."]},
     {g:"Formu doldur",ic:"form",i:["Uygulayıcı Notları: Durak 1'de seçilen sorun, seçilen beceri, çocuğun amacı ve yolu.","\"Görev / Öneri 1\" alanına amacı ve kontrol zamanını yaz."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["sorun","Durak 1'de seçilen sorun"],["beceri","Çocuğun seçtiği beceri"],["amac","Bu haftanın amacı"],["kontrol","Kontrol zamanı"]]},
     {g:"3. Oturuma hazırlık",ic:"next",i:["Koç getirecek: Koç Raporu (Görev 1 işaretlenmiş).","3. Oturumda Çalışma Kitabı 1 başlıyor; Beceri Kontrol Kartı 1'i hazırla."]},
     {done:true} ]
  ]},
3:{
  facts:["≈ 50 dk","Uygulayıcı ve çocuk","Koç açılışta ve kapanışta"],
  phases:[
   [ {g:"Kendin için",ic:"book",i:["Oyun 1 ve Oyun 2 hikâyelerini (Kılavuz s. 4 ve 6) iki kez sesli oku; ipucu sözcüklerini vurgulamayı dene.","Oyun 2'nin tuzaklarını işaretle: \"ileri\" ve \"solucan\" ipucu değil, \"geri kalmıyor\" (10) ipucu.","Oyun 2'ye geçiş kuralını hatırla: Oyun 1'de 11 ipucunun 9'u ya da fazlası doğruysa."]},
     {g:"Odayı hazırla",ic:"box",i:["Yaklaşık 12 adımlık boş bir şerit aç; başlangıç çizgisini bantla işaretle.","Oyun 2'de çocuk 18 adım ilerler; alan yetmezse adımları küçültmeyi ya da geriye yer değiştirmeyi planla."]},
     {g:"Yazdır",ic:"print",i:[["Beceri Kontrol Kartı 1 (çocuğa bir kopya)","pdf"],["İpucu kaydı satırı (Oyun 1: 11 kutu)","pdf"],["Oturum Değerlendirme ve Takip Formu","pdf"]]},
     {g:"Masaya",ic:"box",i:["Beceri Kontrol Kartı 1: Simon Diyor: Dikkat Et, Rotada Kal","Oyun 1 ve Oyun 2 hikâye metinleri (Kılavuz s. 4 ve 6)","Bant ya da yere konan işaretler","Boş kartlar, kalın kalem, boya kalemleri","Çocuğun 2. Oturumda doldurduğu Peki Ya Sen? sayfasının kopyası"]},
     {g:"2. Oturumdan gelen",ic:"back",prev:2,pf:[["sorun","Durak 1'de seçilen sorun"],["beceri","Çocuğun seçtiği beceri"],["amac","Haftanın amacı"],["kontrol","Kontrol zamanı"]],i:["Koçun getirdiği Koç Raporu (Görev 1, −2 ile +2 arası işaretli)","Peki Ya Sen? sayfasındaki amaç: Etkinlik 6'da ipucu bu amaç için tasarlanacak."]} ],
   [ {a:1,t:"Karşılama: Kontrol zamanı nasıl geçti?",dk:5,ref:"s. 2",koc:"Koç odada",i:["Koç Raporu'nu al; Görev 1 değerine birlikte bak.","Önce çocuğa sor, sonra Koçtan bir \"denediği an\" anlatmasını iste.","Sonuç ne olursa olsun denemeyi takdir et; işe yaramadıysa bugünün konusuna bağla.","Kontrol zamanı hiç yapılmadıysa suçlama; engeli not et (Etkinlik 6'da kullanılacak).","Koç dışarıda bekler; sonda geri gelecek."]},
     {a:2,t:"Hazır ol: Kart ve oyun alanı",dk:5,ref:"s. 3",mat:"Beceri Kontrol Kartı 1",i:[["Kartın kopyasını çocuğa ver; dört maddeyi birlikte oku ve oyunla ilişkilendir.","CB"],"Çocuk başlangıç çizgisinde, senden yaklaşık 12 adım uzakta dursun.","İki üç deneme adımı at: ne çok büyük ne çok küçük.","Üç kuralı söyle ve çocuğa tekrarlat: erken adım, kaçırılan adım, yanlış boyda adım → başa dön."]},
     {a:3,t:"Oyun 1: Dikkat Et",dk:7,ref:"s. 4",mat:"Oyun 1 hikâyesi · 11 ipucu",i:["İpucu sözcükleri: Simon · diyor · dikkat → bir adım ileri.","Yavaş ve net oku; ilk turda ipucu sözcüklerini ayrıca vurgulama.",["Her ipucu için ✓ ya da ✗ kaydet; ilk turda yardım etme.","CB"],"Başa dönerse kaldığın yerden devam et; puan sıfırlanmaz.","\"İleri, geri, sağa, sola\"da hareket ederse \"ipucu olmayan sözcükte hareket\" satırına işle."]},
     {a:4,t:"Gözden geçir, gerekirse ipucunu düzenle",dk:8,ref:"s. 5",mat:"Beceri Kontrol Kartı 1",i:["Önce güçlü yanı adlandır: \"Aklında tuttun, ipucunu bekledin.\"","9/11 ya da üstü → kartı kısaca geç, Oyun 2'ye geç.","Zorlandıysa → kartın 4. maddesini hatırlat, ipucunu birlikte düzenle, Oyun 1'i tekrar oyna.","Düzenleme seçenekleri: ses, göz teması, görsel kart, el çırpma, özel işaret. Seçimi çocuk yapsın.","Bitince adlandır: \"Kendi ipucunu kendin düzenledin.\""]},
     {a:5,t:"Oyun 2: Dikkat Et, Rotada Kal",dk:10,ref:"s. 6–7",mat:"Oyun 2 hikâyesi · 36 ipucu",i:["Yalnızca Oyun 1'de başarılı olduysa oyna; değilse bu süreyi Oyun 1 tekrarına ayır.","Kurallar: Simon/diyor/dikkat → ileri · geri → geri · sağ/sağa → sağa · sol/sola → sola.","Okumadan önce dört kuralı birer kez dene.",["Kayıt ve \"ilk turda yardım etme\" kuralı Oyun 1 ile aynı.","CB"],"Bitince güçlü yanı adlandır; zorlandıysa bir düzenleme seçip tekrar oyna, sonra \"Bravo!\" de."]},
     {a:6,t:"Bu Benim İpucum",dk:10,ref:"s. 7",mat:"Boş kart, kalın kalem, Peki Ya Sen? (2. Oturum)",i:["Hedef: Peki Ya Sen?'deki amaç (Etkinlik 1'deki engeli de dikkate al).","Köprü: \"Oyunda hangi ipucu işine yaradı?\" İşe yarayan türden başla.","Tür seç (görsel / işitsel / dokunsal); kartı çocuk çizsin ya da yazsın.","Performans noktası: \"Nerede ve ne zaman görürsün?\"","B planı: \"İşe yaramazsa türünü ya da yerini değiştiririz.\"","Üç soru: Dikkat çekiyor mu? Tek şey mi söylüyor? Doğru yerde mi?"]},
     {a:7,t:"Kapanış: Bravo Başardın!",dk:5,ref:"s. 8",koc:"Koç geri döner",i:["Koçu davet et; çocuk oyunu ve ipucunu Koça kendisi anlatsın.","İpucunun evde nereye konacağına çocuk ve Koç birlikte karar versin.","Kart 1'i son kez birlikte oku; kocaman bir \"Bravo!\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Çocuğun ipucu kartı, kararlaştırılan yere konmak üzere eve gider; bir hafta denenir.","Beceri Kontrol Kartı 1'in kopyası çocukta kalır."]},
     {g:"Koça söyle",ic:"hand",i:["İşe yaramazsa vazgeçilmez; türü ya da yeri değiştirilir (kartın 4. maddesi).","İşe yaradığında adlandırsın: \"İpucun sana hatırlattı ve sen de yaptın.\"","İpucunu yeniden söylemek ya da işi çocuğun yerine yapmak yerine biraz beklesin; unutursa kızmasın."]},
     {g:"Formu doldur",ic:"form",i:["Uygulayıcı Notları: Oyun 1 doğru sayısı, Oyun 2 oynandı mı, kullanılan düzenleme.","Çocuğun ipucu (tür / yer / hedef) ve Koç Raporu Görev 1."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["oyun1","Oyun 1 doğru ipucu (/11)"],["oyun2","Oyun 2 oynandı mı?"],["duzen","Kullanılan düzenleme"],["ipucu","Çocuğun ipucu (tür / yer / hedef)"]]},
     {g:"4. Oturuma hazırlık",ic:"next",i:["Sabah DJ'i hikâyesini (ÇK1 s. 64–66) oku.","Oyun 2 bu oturumda oynanmadıysa 4. Oturumun başında kısa bir tur planla."]},
     {done:true} ]
  ]},
4:{
  facts:["≈ 50 dk","Uygulayıcı ve çocuk","Koç açılışta ve kapanışta"],
  phases:[
   [ {g:"Kendin için",ic:"book",i:["Sabah DJ'i hikâyesini (ÇK1 s. 64–66) bir kez sesli oku; rollerin değiştiği yerleri işaretle.","İki durağın yerini belirle: sabah sahnesinin sonu ve Sabah DJ'i fikrinden sonra.","Konuşalım'daki altı sorudan özdeki üçünü seç (3, 5, 6)."]},
     {g:"Yazdır",ic:"print",i:[["İpucu Listesi formu (Kılavuz s. 8)","pdf"],["Peki Ya Sen? formu (Kılavuz s. 9)","pdf"],["Oturum Değerlendirme ve Takip Formu","pdf"]]},
     {g:"Masaya",ic:"box",i:["Beceri Kontrol Kartı 1","Sabah DJ'i hikâyesi, iki kopya: çocuğun kopyasında Ece'nin sözleri fosforlu kalemle işaretli","İpucu Listesi cevap anahtarı (Kılavuz s. 5)","Fosforlu kalem, kurşun kalem, silgi"]},
     {g:"3. Oturumdan gelen",ic:"back",prev:3,pf:[["ipucu","Çocuğun ipucu"],["duzen","Oyunda işe yarayan düzenleme"],["oyun2","Oyun 2 oynandı mı?"]],i:["Çocuğun tasarladığı ipucunun bir haftası: nerede durdu, işe yaradı mı?"]} ],
   [ {a:1,t:"Karşılama: İpucun nasıl çalıştı?",dk:5,ref:"s. 2",koc:"Koç odada",i:["Önce çocuk anlatsın: İpucu nerede durdu, işine yaradı mı?","Koçtan ipucunun işe yaradığı bir anı anlatmasını iste.",["İşe yaramadıysa kartın 4. maddesi: türünü ya da yerini birlikte değiştirin.","CB"],"Hiç kullanılmadıysa merakla sor: \"Ne oldu da kullanamadın?\" Yanıtı Etkinlik 6'ya sakla.","Koç dışarıda bekler; sonda geri gelecek."]},
     {a:2,t:"Hazır ol: Kart bugün bir gözlük",dk:3,ref:"s. 3",mat:"Beceri Kontrol Kartı 1",i:["Bugün oyun yok; kart, hikâyedeki karakteri görmek için kullanılacak.","Dinleme görevi ver: \"Ece'nin kartın hangi maddesinde zorlandığını yakala.\""]},
     {a:3,t:"Sabah DJ'i: Hikâyeyi canlandırın",dk:10,ref:"s. 3",mat:"ÇK1 s. 64–66",i:["Roller: Ece = çocuk · Anlatıcı, Anne, Baba = sen. Sesini değiştir.","Okumakta zorlanırsa Ece'nin sözlerini önce sen oku, o tekrar etsin.","Durak 1 (sabah sonunda): \"Ece neyi unuttu? Sence neden?\" Yanıtı düzeltme.","Durak 2 (Sabah DJ'i fikrinden sonra): \"Sen hangi işin şarkısını ilk seçerdin?\"","Çocuk kendi sabahlarını anlatırsa yargılama; Etkinlik 6 için not et."]},
     {a:4,t:"Konuşalım: Ece'nin sorunu neydi?",dk:10,ref:"s. 4",mat:"ÇK1 s. 67",i:["Sohbet gibi sor; altı sorunun hepsi gerekmez.",["Soru 3 (öz): \"Ece bilerek mi unutuyordu?\" Ece'nin sözünü birlikte oku: \"Deniyorum…\"","CB"],"Soru 5 (öz): Kartın dört maddesini Ece'nin sabahına taşı.","Soru 6 (öz): Babanın kartı ve Ece'nin şarkısı → çalışma belleğini adlandır.","\"Herkesin bazen bir yardımcıya, yani ipucuna ihtiyacı olur.\""]},
     {a:5,t:"İpucu avı: İpucu Listesi",dk:10,ref:"s. 5",mat:"İpucu Listesi formu (s. 8)",i:["İlk satırı (çalar saat) sesli düşünerek birlikte yap.","Her kişi için ipucunun harfini yazsın; eylem ve iki sonuç sözlü olabilir.","Süre azsa üç satır yeterli; mutlaka koşucu ya da futbolcu satırını seç.",["Her satırda kartın 2. maddesini hatırlat: İpucunu bekle.","CB"]]},
     {a:6,t:"Peki ya sen? Kendi ipuçların",dk:7,ref:"s. 6",mat:"Peki Ya Sen? formu (s. 9)",i:["Çocuk alanı kendisi seçsin: okulda, evde ya da arkadaşlarla.","Her alanda: İpucu ne? Hangi adımlar, hangi sırayla?","Bir ya da iki alan yeterli; \"evde\" satırını 3. Oturumdaki ipucuyla ilişkilendir.","Örnekleri çocuk takılmadıkça önce sen söyleme."]},
     {a:7,t:"Kapanış: Koçla paylaş",dk:5,ref:"s. 6",koc:"Koç geri döner",i:["Çocuk Sabah DJ'i fikrini Koça kendi sözleriyle anlatsın.","Peki Ya Sen? sayfasını Koçla paylaşsın; \"evde\" satırını birlikte okuyun.","İsteğe bağlı kısa bravo: \"Ece'nin neyi neden unuttuğunu çok iyi yakaladın.\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Peki Ya Sen? sayfası eve gider.","3. Oturumdaki ipucu kullanılmaya devam eder (gerekirse yeni yeri ya da türüyle)."]},
     {g:"Koça söyle",ic:"hand",i:["\"Evde\" ipucuna çocuk yanıt verince fark etsin ve adlandırsın: \"İpucunu duydun ve hemen başladın.\"","Tekrar tekrar söylemek ya da kızmak yerine ipucuna yönlendirsin: \"Kartına bak\", \"Alarmın çaldı.\"","Sabah DJ'ini evde denemek isterse desteklenir; bu hafta zorunlu değil."]},

   [ {a:1,t:"Karşılama: Haftanı anlat",dk:5,ref:"s. 2",koc:"Koç odada",i:["Çocuğa sor: \"Evde\" ipucunu fark ettiği bir an oldu mu?","Koçtan ipucuna yanıt verdiği bir anı anlatmasını iste.","İşe yaramayan anı not et; Etkinlik 5'te o an için kart yapılabilir.","Hafta iyi geçmediyse: \"Bugün daha güçlüsünü yapacağız.\"","Koç dışarıda bekler; Etkinlik 6'da geri gelecek."]},

     {a:3,t:"\"Olamaz, unuttum!\" Herkes unutur",dk:5,ref:"s. 3",i:["\"Annenin, babanın 'Olamaz, … unutmuşum!' dediğini duydun mu?\" Boşluğu birlikte doldurun.","Unutmayı normalleştir: çoğu insan unutur, bazıları daha sık.","İki kural: 1 · Yaz (ya da çiz). 2 · Doğru yere koy."]},
     {a:4,t:"Dedektiflik: Bu kart nereye?",dk:7,ref:"s. 3",mat:"ÇK1 örnek kartları",i:["Örnek: Klozet notu mutfağa yapışsa işe yarar mı?","Dört örnek kartın yerini tartışın: klozet, doktor randevusu, imza evrakı, ödev Başla!'sı.","Önce çocuğun fikri; makulse kabul et.","Tek soru yeterli: \"Tam o işi yapacağın anda bu kartı görür müsün?\""]},
     {a:5,t:"İpucu kartı atölyesi",dk:15,ref:"s. 4–5",mat:"Başla! / Unutma! / Hatırlayacağım! kartları",i:["Durumu seç: \"Senin bazen unuttuğun şeyler neler?\" Bir ya da iki durum yeter.","Türü çocuk seçsin: Başlamak mı zor (Başla!), ne yapacağını hatırlamak mı (Unutma!)?",["Kartın üstüne tek bir eylem: yazı ya da çizim. Hazır verme, seçenek sun.","CB"],"Dedektif sorusunu sor; yeri kartın arkasına yaz.","Fikir çıkmazsa ipucu bankasından iki seçenek sun.","İsterse evde unutan başka biri için de bir kart; ama az kart, çok dikkat."]},
     {a:6,t:"Gizli işaret: Koçla bizim işaretimiz",dk:10,ref:"s. 6",koc:"Koç odaya gelir",i:["Koça sor: \"Evde en sık hatırlatmak zorunda kaldığınız an?\" Tek durum seç.","İşareti çocuk ve Koç birlikte seçsin: el hareketi, kısa kelime ya da mimik.","Anlamını çocuk söylesin; cümlesini aynen tekrar et.","Bir kez deneyin: Koç işareti yapar, çocuk eylemi canlandırır.","Koç için dört kural: sessiz, açıklamasız, azarsız, amaç çocuğun kendini hatırlatması.","İstersen Michael Phelps'in \"C\" işaretini anlat."]},
     {a:7,t:"Kapanış: Kartlar eve gidiyor",dk:5,ref:"s. 7",koc:"Koç odada",i:["Çocuk kartlarını Koça göstersin ve her birinin yerini kendisi söylesin.","Gizli işaret planını üçünüz doldurun: durum, işaret, çocuğun cümlesi, evde / okulda.","İsteğe bağlı kısa bravo: \"Bugün kendi kartlarını kendin yaptın.\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Çocuğun ipucu kartları, bant ya da yapışkan hamurla birlikte.","Gizli işaret planı (bir kopya Koçta)."]},
     {g:"Koça söyle",ic:"hand",i:["Kartlar seçilen yerlere konur; çocuk doğru zamanda hatırlatıp hatırlatmadığına bakar.","Gizli işaret yalnızca planlanan durumda ve dört kurala uyarak kullanılır.","İşe yaramazsa yeri, türü ya da işaret değişir; başarısızlık sayılmaz."]},
     {g:"Formu doldur",ic:"form",i:["Hazırlanan kartlar (tür ve yer).","Gizli işaret planı: durum, işaret, çocuğun cümlesi."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["kartlar","Kartlar ve yerleri"],["isaret","Gizli işaret ve durumu"],["cumle","Çocuğun cümlesi"]]},

   [ {a:1,t:"Karşılama: Kartlar ve işaret",dk:5,ref:"s. 2",koc:"Koç odada",i:["Çocuğa sor: \"Kartı koyduğun yerde gördüğünde ne oldu?\"","Koça sor: Gizli işaret kaç kez kullanıldı, işe yaradı mı?",["Yaramayan kart ya da işaretin yerini, türünü ya da kendisini birlikte değiştirin.","CB"],"Koç dışarı çıkmaz: liste ve oyunlar evde onunla sürecek."]},
     {a:2,t:"Hazır ol: Bir ipucu yetmediğinde",dk:3,ref:"s. 2",mat:"Beceri Kontrol Kartı 1",i:["Ece'nin sabahını hatırlat: arka arkaya pek çok iş.",["Kartın 1. maddesi: Ne yapacağını hatırla. Bugün çok şeyi birden hatırlamanın yolları.","CB"]]},
     {a:3,t:"Bir iş seç, küçük adımlara böl",dk:10,ref:"s. 3",koc:"Koç odada",i:["Koç ve çocuk birlikte sık yapılan, adımları karışan bir iş seçsin.","Adımları çocuk sırayla söylesin; onun sözcüklerini koru.","En fazla beş adım; her biri kısa, net, tek eylem (\"Odanı topla\" değil, \"Kitapları rafa koy\").","Son satıra küçük bir ödül: hikâye, kısa oyun, yıldız. Basit tut."]},
     {a:4,t:"Bilek listesini yap ve tak",dk:10,ref:"s. 4",mat:"Bilek listesi formları (s. 9–14)",i:["Türü çocuk seçsin: kağıt zincir · yapışkan · kontrol listesi.","Kağıt zincir (s. 9): bir kez yapılacak işler; ödül bileklikte gizli, ilk iş serbest uçta.","Yapışkan (s. 10, 12–14): her gün tekrarlanan rutinler; ikonlar Başla!'dan Bravo!'ya taşınır.","Kontrol listesi (s. 11): en basit tür; Koçla birlikte onay işareti.","Etkinlik 3'teki adımlarla listeyi hazırla ve bileğine tak; diğer formlar Koça verilir."]},
     {a:5,t:"Hafıza oyunu 1: Bir yolculuğa çıkıyoruz",dk:8,ref:"s. 5",koc:"Koç da oyuncu",i:["Her oyuncu önceki eşyaları sırayla tekrar edip bir eşya ekler; komik eşyalar serbest.","Kaç eşya hatırlandı? Ortak rekoru yaz.",["Zorlaşınca bir yardımcı seç: hep birlikte tekrar · komik resim · ilk harfleri yaz.","CB"],"İkinci turu oyna, rekoru karşılaştır: \"İlk harfler de bir ipucu; bilek listen de böyle çalışıyor.\""]},
     {a:6,t:"Hafıza oyunu 2: Hazır ol, Pozisyon al, Başla!",dk:8,ref:"s. 6",mat:"Odadaki günlük nesneler",i:["Hazır ol: sen söylersin, o dinler · Pozisyon al: sesli tekrar eder · Başla!: gider ve yapar.","Turlar: A 1 şey → B 2 → C 3 → D 4 şey.",["Zorlanınca \"Pozisyon al\"da bir yardımcı: üç kez tekrar · zihindeki film · tek resim.","CB"],"Bitirirken tek soru: \"Hangi yardımcı işe yaradı?\" ya da \"Evde hangisini kullanırsın?\"","Zaman kısıtlıysa iki oyundan birini oyna; diğeri evde Koçla."]},
     {a:7,t:"Kapanış: Liste bileğinde eve gidiyor",dk:5,ref:"s. 7",koc:"Koç odada",i:["Çocuk bileğindeki listeyi Koça anlatsın: iş, adımlar, sonunda ne var?","Listenin evde ilk ne zaman kullanılacağına birlikte karar verin.","En sevdiği oyunu ve işine yarayan yardımcıyı adlandır.","\"Liste kullanmak akıllıca bir yardımdır; büyükler de liste kullanır.\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Bilekteki liste ve diğer bilek listesi formları.","Hafıza oyunlarının kuralları; rekor bir sonraki oturumda konuşulacak."]},
     {g:"Koça söyle",ic:"hand",i:["1–3. hafta: liste her seferinde bilekte; Koç her adımı hatırlatmaz, listeyi gösterir.","Deneme günü: \"Bu işi listesiz yapabiliyor muyum?\" Bir kez denenir.","Sonuç ne olursa deneme takdir edilir; olmadıysa listeye geri dönülür.","Hafıza oyunları kısa ve sık: arabada, yemek beklerken, yatmadan önce."]},
     {g:"Formu doldur",ic:"form",i:["Seçilen iş, adımlar ve ödül; liste türü.","Oynanan oyun(lar), rekor ve işe yarayan yardımcı."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["is","Seçilen iş ve liste türü"],["rekor","Yolculuk oyunu rekoru"],["yardimci","İşe yarayan hafıza yardımcısı"]]},

   [ {a:1,t:"Karşılama: Liste ve oyunlar",dk:5,ref:"s. 2",koc:"Koç odada",i:["Çocuğa sor: Listeyi kaç kez kullandı, en sevdiği oyun hangisi, rekoru kaç?","Koçtan listeyle bir işin bittiği bir anı anlatmasını iste.","Bu anı not et: Etkinlik 3'te özel övgü örneği olacak."]},
     {a:2,t:"Geriye bakış: Benim ipuçlarım",dk:8,ref:"s. 2",mat:"Önceki kartlar ve listeler",i:["3. Oyun: \"Oyunda ipucunu nasıl güçlendirmiştik?\"","4. Sabah DJ'i: \"Senin çalar saatin, başlama düdüğün ne?\"","5. Atölye: \"Hangi kartın en çok işe yaradı?\"","6. Bilek: \"Hangi yardımcıyı kullanmayı seviyorsun?\"",["\"Hangisi senin en iyi ipucun?\" Kartın hangi maddesine yardım ediyor? Not et.","CB"]]},
     {a:3,t:"Koçla: Davranışa özel övgü",dk:10,ref:"s. 3",koc:"Koçla yürütülür",i:["Genel övgü, teşvik ve özel övgü örneklerini karşılaştır (Mert örneği).","Kural: Ne yaptı? → Ne oldu? → Adını koy.","Kartın sözcüklerini kullan: hatırladın · bekledin · doğru eylemi yaptın · düzenledin.","Şimdi deneyin: Koç, Etkinlik 1'deki anı kullanarak çocuğa özel bir övgü söylesin.","Cümle genel kalırsa birlikte yeniden kurun."]},
     {a:4,t:"Koçla: Üç anda üç cümle",dk:10,ref:"s. 4",mat:"Teşvik edici sözler (s. 8)",koc:"Koçla yürütülür",i:["Başlarken: İyi niyeti destekle, ipucu öner.","Zorlanınca: Suçlamadan stratejiye geç (\"Gel bu ipucunu güçlendirelim\").","Başarınca: Sonucu çabaya ve stratejiye bağla.","Performans noktasında, tam o anda söylemenin önemini konuş.","Teşvik edici sözler sayfasını Koça ver; ezber gerekmez, tek kural: ne yaptığını tanımla."]},
     {a:5,t:"Çemberi genişlet: Beceri Takip Formu",dk:7,ref:"s. 5",mat:"Beceri Takip Formu (s. 9)",i:["Çocuk haftasını başka kimin yanında geçiriyor? Büyükanne, bakıcı, öğretmen.","Çocukla bir hedef beceri belirle (ör. \"İşareti görünce sifonu çekmek\").","Her yetişkin için ayrı form; Koç ona ipucunu ya da gizli işareti öğretir.","Yetişkin tarihi ve ne olduğunu kısaca yazar (Berk ve büyükanne örneği)."]},
     {a:6,t:"Aferin biletleri",dk:5,ref:"s. 5",mat:"Aferin biletleri (s. 10)",i:["Biletleri kes; çocuğun gösterdiği becerinin yanına işaret koy.","İşaretlediğin beceriyi ortaya çıktığı durumla birlikte konuş.",["İlk Aferin biletini ver: \"Burada 'Ne yapacağını hatırla' yazıyor.\"","CB"],"Bilet hiç geri alınmaz, ceza olarak kullanılmaz."]},
     {a:7,t:"Kapanış: Bravo, başardın!",dk:5,ref:"s. 6",koc:"Koç odada",i:["Çocuk \"en iyi ipucunu\" Koça anlatsın.","Koç, strateji + sonuç kuralıyla kısa bir bravo söylesin.","Çalışma Kitabı 1'in bitişini birlikte kutlayın: \"Artık ipuçlarında bir uzmansın!\""]} ],

     {g:"Koça söyle",ic:"hand",i:["Hafta boyunca en az üç kez davranışa özel övgü denesin.","Çocuk başka yerde kalıyorsa Beceri Takip Formu devreye girsin.","Çocuk ipuçlarını ve gizli işareti kullanmaya devam etsin."]},
     {g:"ÇK2'ye geçmeden kontrol et",ic:"form",i:["Çocuk en az bir ipucunu evde düzenli kullanıyor.","İşe yaramayan bir ipucunu değiştirebileceğini biliyor (kartın 4. maddesi).","Koç gizli işareti ve davranışa özel övgüyü kullanıyor.","Eksik varsa ÇK1 ev çalışmalarına bir iki hafta daha devam et."]},

   [ {a:1,t:"Karşılama: Bravo haftası nasıl geçti?",dk:5,ref:"s. 2",koc:"Koç odada",i:["Kaç Aferin bileti kazanıldı? Beceri Takip Formuna kim, ne yazdı?","Koç bir bileti çocuğa okusun; beceriyi bir cümleyle adlandır.","Koça yeni bir kitaba başlandığını söyle; Koç çıkar, kapanışta döner."]},
     {a:2,t:"Hazır ol: Yeni kitap, yeni beceri",dk:5,ref:"s. 2",i:[["Yeni beceriyi sade bir dille tanıt: \"Bazen ne yapacağımızı biliriz ama elimiz ayağımız bizden önce davranır.\"","TE"],"Oyunu tanıt: \"Bu oyunda ne yapmadığın çok önemli.\"","Pozisyon al: sen bitişte (Simon), çocuk başlangıçta.","Kuralı tekrarlat: Yalnızca \"Simon diyor ki…\" ile başlayan komutları yap.","Bir iki deneme komutuyla ısın."]},
     {a:3,t:"Oyun 1: Simon'un dikkat testi",dk:12,ref:"s. 3–4",mat:"Komut listesi (s. 4)",i:["Giriş hikâyesini gizemli bir sesle anlat: Simon dünyanın en dikkatli lideri.",["10 komutu sırayla oku; tuzakta kıpırdarsa başlangıca, durursa \"Aferin!\"","TE"],"9. komut büyük tuzak: \"Koş ve çizgiyi geç!\"","Zorluğu ayarla: kolaysa tempoyu artır, zorlanıyorsa yavaşla.","Son anda durursa: \"Tam yapacaktın ama fark ettin ve kendini durdurdun!\""]},
     {a:4,t:"Gözden geçir: Yapmadıkların da önemli",dk:5,ref:"s. 4",i:["\"Bazen yapmadıklarımız da en az yaptıklarımız kadar önemlidir.\"","Oyundan somut bir an ver: \"Koş dediğimde ayağın kalktı ama bastırdın.\"","Başa döndüğü anları suçlamadan geç: \"O tuzak gerçekten zordu.\"","Geçiş: \"Oyunu biraz daha zorlaştırmaya hazır mısın?\""]},
     {a:5,t:"Oyun 2: Sihirli fısıltı",dk:15,ref:"s. 5–6",mat:"Beceri Kontrol Kartı 2",i:[["Kartı birlikte oku, bir kopyasını ver; 3. maddeyi vurgula: Kendine \"Bunu yapma\" de.","TE"],"Üç değişiklik: daha zor · sihirli fısıltı · başa dönüş.","Fısıltı provası: \"Zıpla!\" deyince durup \"Bunu yapma!\" desin; robot sesi, kalın ses ile eğlendir.","Tuzak taktiklerini karıştır: Slimon, \"Simon öneriyor ki\", çocuğun adı, komik hareket.","Anlık geri bildirimi fısıltıya bağla: durdu ve fısıldadı · durdu ama fısıldamadı · duramadı."]},
     {a:6,t:"Gözden geçir: İçindeki patron",dk:4,ref:"s. 6",mat:"Beceri Kontrol Kartı 2",i:["\"Kendi kendine konuşmak beynine patronun kim olduğunu hatırlatıyor.\"","Kartı bir kez daha oku; her madde için oyundan bir an hatırla.","\"Hangi tuzak seni en çok zorladı? O an kendine ne dedin?\""]},
     {a:7,t:"Kapanış: Koça yeni kuralı öğret",dk:4,ref:"s. 7",koc:"Koç geri döner",i:["Çocuk kartı gösterip yeni kuralı Koça kendisi anlatsın.","Kısa tur: çocuk Simon, Koç oyuncu; Koç bir tuzakta \"Bunu yapma!\" diye fısıldasın.","Kartın ikinci kopyası çocukla eve gitsin.","İsteğe bağlı mini bravo: \"Koş dediğimde koşmadın ve kendine 'Bunu yapma' dedin.\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Beceri Kontrol Kartı 2 (bir kopya).","Hafta boyunca isteğe bağlı kısa \"Bunu Yapma!\" turları; Simon bazen çocuk, bazen Koç."]},
     {g:"Koça söyle",ic:"hand",i:["Oyunda kullanılan beceriyi adlandırsın: \"Simon demeden kıpırdamadın, kendine 'Bunu yapma' dedin.\"","Bu hafta gerçek hayattaki dürtüleri düzeltmeye çalışmasın; amaç stratejiyi oyunda tanımak.","Başa dönmek başarısızlık değil; iyi niyeti ve denemeyi görsün."]},
     {g:"Formu doldur",ic:"form",i:["Oyun 1'de en çok zorlayan tuzak; Oyun 2'de fısıltı kullanımı.","En çok işe yarayan şaşırtmaca ve Koçla kararlaştırılan."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["tuzak","En çok zorlayan tuzak"],["fisilti","Fısıltıyı kullanma (çoğunlukla / hatırlatmayla / henüz değil)"],["karar","Koçla kararlaştırılan"]]},
     {g:"9. Oturuma hazırlık",ic:"next",i:["Hikâye metnini (Kılavuz s. 8–9) iki kopya çoğalt; Berk'in repliklerini işaretle.","İstersen oyuncak ya da kartondan bir \"ZAP\" kumandası hazırla."]},

   [ {a:1,t:"Karşılama: \"Bunu yapma!\" haftası",dk:5,ref:"s. 2",koc:"Koç odada",i:["Çocuğa sor: Evde oyun oynandı mı? Simon kim oldu?",["Koçtan fısıltının kullanıldığı bir anı iste; adlandır: \"Kendine 'Bunu yapma' dedin ve durdun.\"","TE"],"Koç çıkar; kapanışta geri dönecek."]},
     {a:2,t:"Hazır ol: Bugün bir tiyatro oyunu var",dk:3,ref:"s. 2",mat:"Beceri Kontrol Kartı 2",i:["Berk'i tanıt: oyun oynamayı seviyor, ödevini bitirmekte zorlanıyor.","Roller: Berk = çocuk · Anlatıcı, Arda, Efe, Alp = sen.","Dinleme görevi: \"Berk'in dikkatini neler dağıtıyor, yakala.\""]},
     {a:3,t:"Hikâyeyi canlandır: Engelleyici Kumanda",dk:12,ref:"s. 3",mat:"Hikâye metni (s. 8–9)",i:["Pazartesi ve Salı: Berk'in dikkat dağıtıcıları, kaçan oyun saati.","Durak 1 (Salı sonu): \"Berk şu an ne hissediyor? Neden bitiremedi?\"","Çarşamba: Alp'in sırrı, görünmez kumanda ve \"Zap!\"",["Durak 2 (şapkadan önce): Çocuk odadaki bir nesneye kumandasını doğrultup \"Zap!\" desin.","TE"],"\"Bu kamptan nefret ediyorum!\" duygusunu hayal kırıklığı olarak adlandır."]},
     {a:4,t:"Konuşalım: Hikâye soruları",dk:8,ref:"s. 4",mat:"Hikâye soruları (s. 10)",i:["Zaman kısaysa yalnızca çekirdek sorular: 2, 4, 6.","Soru 2: Berk bilerek mi yavaştı? Niyet var, durdurmak zor.","Soru 4: Alp'in iki işareti neydi?","Soru 6: Çocuğun kendi dikkat dağıtıcısı. Yargılamadan dinle; Etkinlik 6'ya sakla.",["Kendi \"Zap\" sözcüğünü seçsin: Zap!, Bunu yapma!, Kırmızı ışık!, Dur! ya da kendi bulduğu.","TE"]]},
     {a:5,t:"Yap mı, yapma mı? Başkalarında",dk:8,ref:"s. 5",mat:"Çalışma sayfası (s. 11)",i:["Üç sütun: Yap! · Yapma! · Saparsa ne olur?","İlk satırı (araba kullanan kişi) sen örnekle; diğerlerinde çocuk önersin.","Her satırda bir iki fikir yeterli.","\"Sence şoför o an kendine ne fısıldamalı?\"","Takılırsa canlandır: \"Hadi ikimiz otobüs şoförü olalım.\""]},
     {a:6,t:"Peki ya sen?",dk:8,ref:"s. 6",mat:"Çalışma sayfası (s. 12)",i:["Çocuk çok iyi yaptığı bir işi seçsin: futbol, video oyunu, kardeşine bakmak.","Üç \"yap\", üç \"hedef dışı\" davranış ve sapınca ne olacağını yazın.","Soru 6'daki örneğine bağla: \"O an senin kumandan ne derdi?\""]},
     {a:7,t:"Kapanış: Bir anlaşma yapalım",dk:6,ref:"s. 6",koc:"Koç geri döner",i:["Çocuk Berk'in kumandasını ve kendi \"Zap\" sözcüğünü Koça anlatsın.","Koç ve çocuk Alp'in işaretini (kumandayı doğrultmak) gizli işaret yapabilir.","Zap sayacını tanıt: her Zap için bir daire boyanır.","İsteğe bağlı mini bravo: \"Şapkaya Zap dedin ve kendi sözcüğünü buldun.\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Zap sayacı: küçük bir kâğıda çizilmiş daireler.","\"Peki ya sen?\" sayfası."]},
     {g:"Koça söyle",ic:"hand",i:["Gördüğü bir Zap'ı adlandırsın: \"Tablete baktın, sonra Zap dedin ve ödevine döndün.\"","Çocuk unutursa kızmasın; sessizce kumanda işaretini yapsın.","Hatırlatmak Koçun, durmak çocuğun işi."]},
     {g:"Formu doldur",ic:"form",i:["Çocuğun dikkat dağıtıcıları ve seçtiği sözcük.","\"Peki ya sen?\"de seçilen güçlü alan; gizli işaret kararı."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["zap","Çocuğun \"Zap\" sözcüğü"],["dagitici","Kendi dikkat dağıtıcısı"],["isaret","Kumanda işareti kararı"]]},
     {g:"10. Oturuma hazırlık",ic:"next",i:["Koça bir sonraki oturumda baştan sona odada olacağını söyle.","Oyunlar için engelsiz bir alan ya da koridor ayarla."]},
     {done:true} ]
  ]},

  phases:[
   [ {g:"Kendin için",ic:"book",i:["Kendi \"Bunu Yapma\" örneğini önceden düşün (basit ve genel; ör. kurabiye dolabı).","Durma ipucunu çocuğa göre uyarla: hakem düdüğü, buz ışını, Donma! ya da çocuğun \"Zap\" sözcüğü.","Zaman kısıtlıysa harita sonraki oturumun başına alınabilir."]},

   [ {a:1,t:"Karşılama: Kaç dikkat dağıtıcıyı Zap'ladın?",dk:5,ref:"s. 2",koc:"Koç odada",i:["Zap sayacına birlikte bak: kaç daire, hangi dağıtıcı, hangi sözcük?","Koçtan kumanda işaretini kullandığı bir anı iste. İşe yaradı mı?",["Sayı ne olursa olsun denemeyi adlandır: \"Kendi sözcüğünü hatırladın ve kullandın.\"","TE"],"Bu oturumda Koç dışarı çıkmaz."]},
     {a:2,t:"Hazır ol: Bugün dört görev var",dk:2,ref:"s. 2",mat:"Beceri Kontrol Kartı 2",i:["\"İki oyun oynayacağız, sonra bir kart ve bir harita hazırlayacağız.\"","Hepsinde aynı beceri: doğru anda durmak."]},
     {a:3,t:"Görev 1: Açma-Kapama Düğmesi",dk:8,ref:"s. 3",koc:"Koç da oyuncu",i:["Müze oyunu: sen Müze Müdürü, çocuk özel bir heykel.","Dokunmadan önce izin iste; rahatsız olursa el çırpma ya da zil kullan.",["1. dokunuş AÇIK: heykel canlanır · 2. dokunuş KAPALI: hareketin ortasında donar.","TE"],"Müdür ne heykeli olduğunu tahmin etsin (dansçı, aşçı, trafik polisi…).","Birkaç tur sonra rolleri değiştir: çocuk müdür olsun."]},
     {a:4,t:"Görev 2: Kırmızı Işık-Yeşil Işık",dk:8,ref:"s. 4",koc:"Koç da oyuncu",i:["Sen Trafik Işığı ol; çocuk ve Koç başlangıçta.",["Yeşil Işık: yürü, zıpla, sek · Kırmızı Işık: hemen dur; kıpırdayan başa döner.","TE"],"Önce donmayı göster, deneme turu yap.","Varyasyon: \"Yeşil Çimen\", \"Kırmızı Kalem\" gibi benzer sözcükler.","İlk ulaşan bir sonraki turda Trafik Işığı olur."]},
     {a:5,t:"Görev 3: \"Bunu Yapma\" kartları",dk:12,ref:"s. 5",mat:"\"Bunu Yapma\" kartları (s. 9)",i:["Oyundan hayata: kendi örneğini anlat (kurabiye dolabı gibi).","Çocuğa sor: \"Kendini tutmakta zorlandığın şeyler oluyor mu?\" En az bir davranış seçsin.","Her davranış ayrı karta; arkasına bırakmanın yararlarını yaz.","Koç da kendisi için bir kart yazsın.","Destek planı: kart nereye asılacak, kim hangi ipucunu verecek (Kırmızı Işık, dokunuş, işaret)?"]},
     {a:6,t:"Görev 4: Hedefe Ulaşma Haritası",dk:10,ref:"s. 6",mat:"Harita (s. 10)",i:["Berk'in haritasıyla örnekle: hedef, taşlar, DUR yolları, Alp'in işareti.","Çocuğun zorlandığı tek bir durumu seç: ödev, market, akraba ziyareti.","Taşlara hedefe götüren adımları, DUR yollarına saptıran davranışları yaz.",["İpucunda anlaşın: Koçun işareti + çocuğun kendine söyleyeceği söz.","TE"],"İlk hafta yalnızca bir durum; kısa ve başarılı deneme."]},
     {a:7,t:"Kapanış: Evde dört görev",dk:5,ref:"s. 7",koc:"Koç odada",i:["Çocuk kartlarını ve haritasını Koça anlatsın: kart nereye, harita hangi durumda?","Ev planını birlikte gözden geçir; Koç bir kopyasını alsın.","\"Bu hafta hangisini en çok kullanacaksın sence?\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Çocuğun ve Koçun \"Bunu Yapma\" kartları.","Hedefe Ulaşma Haritası.","Ev planı: dört görev, nasıl ve ne sıklıkla."]},
     {g:"Koça söyle",ic:"hand",i:["Açma-Kapama: sık ama kısa (5 dk).","Kırmızı Işık: önce oyun, sonra çanta hazırlama gibi bir görevde; haftada 2–3 kez.","Kartlar her gün görünür yerde; harita seçilen durum her olduğunda önceden okunur.","Çocuk durduğunda hemen adlandırsın: \"Kırmızı Işık deyince durdun, harika zamanlama.\""]},
     {g:"Formu doldur",ic:"form",i:["Çocuğun kartı (davranış / yer) ve Koçun kartı.","Harita durumu ve ipucu."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["kart","Çocuğun kartı (davranış / yer)"],["harita","Harita durumu ve ipucu"],["koc","Koçun kartı"]]},
     {g:"11. Oturuma hazırlık",ic:"next",i:["ÇK2'nin kapanışı: Bravo, Başardın! Koç ve çocuk baştan sona odada.","İsterse büyükanne, bakıcı ya da öğretmen de gelebilir."]},
     {done:true} ]
  ]},

     {g:"Kendin için",ic:"book",i:["ÇK2 özetini gözden geçir: 8. Oyun · 9. Kumanda · 10. Ev görevleri.","Durdurma becerisinin dilini hatırla: kendini durdurdun · hedefte kaldın · saptığını fark ettin."]},

     {a:2,t:"Geriye bakış: Durdurma araçlarım",dk:8,ref:"s. 2",mat:"ÇK2 araçları",i:["8. Oyun: \"En zor tuzak hangisiydi?\"","9. Kumanda: \"Senin sözcüğün neydi, kullandın mı?\"","10. Ev görevleri: \"Hangi ipucu seni en hızlı durduruyor?\"",["\"Hangisi senin en iyi aracın?\" Kartın hangi maddesine yardım ediyor? Not et.","TE"]]},
     {a:3,t:"Koçla: Durdurma becerisine özel övgü",dk:8,ref:"s. 3",koc:"Koçla yürütülür",i:["Üç övgü türünü karşılaştır: genel · zorlanınca teşvik · başarınca özel övgü (Selin örneği).","Durdurma dilini ver: kendini durdurdun, ipucunu duyar duymaz durdun, hedefine geri döndün.","Canlı deneme: Koç, Etkinlik 1'deki anı bu dille çocuğa söylesin.","Gerekirse kalıp: \"… olduğunda, … ipucuyla kendini durdurdun ve … yapabildin.\""]},
     {a:4,t:"Koçla: Üç anda teşvik",dk:7,ref:"s. 3",mat:"Teşvik edici sözler (s. 7)",koc:"Koçla yürütülür",i:["Başlarken: \"Ne yapacağımızı ve ne yapmayacağımızı biliyoruz.\"","Zorlanınca: \"İpucunun dikkatini daha çok çekmesi için ne yapabiliriz?\"","Başarınca: \"Hedeften saptığını fark etmekte giderek daha iyi oluyorsun.\"","Koçun en zor anı için bir cümleyi şimdi birlikte seçin."]},
     {a:5,t:"Beceri Takip Formu: Yeni kartla",dk:7,ref:"s. 4",mat:"Beceri Takip Formu (s. 8)",i:["Hedefi çocukla somut bir durdurma cümlesiyle yaz (ör. \"Kırmızı Işık ipucunu duyunca durmak\").","Formu kim dolduracak? Büyükanne, bakıcı, öğretmen; eski form kullananlara yeni kopya.","İlk satırı Koçun anlattığı anla birlikte doldur."]},
     {a:6,t:"Aferin biletleri: ÇK2 maddeleriyle",dk:5,ref:"s. 4",mat:"Aferin biletleri (s. 9)",i:[["Çocuğun gösterdiği Kart 2 maddesini işaretle.","TE"],"Becerinin ortaya çıktığı durumu birlikte konuş.","Kurallar: çocuk istemez, yetişkin fark edince verir; geri alınmaz, ceza değildir."]},
     {a:7,t:"Kapanış: Bravo, Başardın!",dk:10,ref:"s. 5",koc:"Koç odada",i:["Koç, çocuğun \"en iyi durdurma aracını\" davranışa özel bir cümleyle adlandırsın.","İlk ÇK2 Aferin biletini ver; kocaman bir \"Bravo!\"","ÇK2 özetini Koçla paylaş: iç konuşma · kendini izleme · ipuçları.","ÇK3'e köprü: çok üzülünce ya da öfkelenince bu araçlar tek başına yetmeyebilir; sırada Değiştirme var."]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Teşvik edici sözler sayfası (Koça).","Kart 2'li Beceri Takip Formu(ları): her yetişkine bir kopya.","ÇK2 Aferin biletleri."]},
     {g:"Koça söyle",ic:"hand",i:["Haftada en az üç kez durdurma becerisine özel övgü söylesin.","\"Bunu Yapma\" kartları ve harita yerinde kalsın; Kırmızı Işık ve Açma-Kapama ipuçları sürsün.","ÇK1 ve ÇK2 araçları ÇK3 boyunca da kullanılacak."]},
     {g:"ÇK3'e geçmeden kontrol et",ic:"form",i:["Çocuk en az bir durdurma aracını (fısıltı, Zap, kart) hatırlatmayla da olsa kendisi başlatabiliyor.","Koç kararlaştırılan ipucunu tutarlı veriyor ve davranışa özel övgüyü kullanıyor.","Aile ÇK1 ve ÇK2 araçlarını ÇK3 boyunca sürdürmeye hazır.","Eksik varsa ilgili ev çalışmalarını sürdür."]},

     {g:"Odayı hazırla",ic:"box",i:["DUR işaretini duvara, çocuğun göz hizasına as (Kılavuz s. 9).","Yumuşak bir top, bir \"sepet\" (kova, kutu) ve skor için kâğıt ya da yazı tahtası."]},
     {g:"Yazdır",ic:"print",i:[["Beceri Kontrol Kartı 3: Dur… Odaklan… Değiştir! (Kılavuz s. 8) · iki kart","pdf"],["DUR işareti (Kılavuz s. 9) · renkli","pdf"],["Oturum Değerlendirme ve Takip Formu","pdf"]]},
     {g:"11. Oturumdan gelen",ic:"back",prev:11,pf:[["enIyi","En iyi durdurma aracı"],["takip","Beceri Takip Formu"],["hazir","ÇK3'e hazır mı?"]],i:["Bravo haftası: ÇK2 Aferin biletleri ve Beceri Takip Formu kayıtları."]} ],
   [ {a:1,t:"Karşılama: Bravo haftası",dk:5,ref:"s. 2",koc:"Koç odada",i:["Aferin biletlerine ve Beceri Takip Formuna birlikte bak: kim, hangi durdurma anını yazmış?",["Koç bir anı okusun; adlandır: \"Kendini durdurdun ve hedefine döndün.\"","TE"],"Koça yeni kitaba başlandığını söyle; Koç çıkar, kapanışta döner."]},
     {a:2,t:"Hazır ol: Yeni kitap, yeni kart",dk:5,ref:"s. 2",mat:"Beceri Kontrol Kartı 3",i:["\"Eğlendiğin bir şeyi bırakıp başka bir şeye geçmek bazen zor olur, değil mi?\"",["Kartı birlikte oku, bir kopyasını ver; dört maddeyi oyunla eşleştir.","BE"],"1 Dur → topu bırak · 2 Odaklan → nefes, gevşe · 3 Değiştir → \"Yeni oyuna hazırım\" · 4 Geçiş → yeni oyuna başla."]},
     {a:3,t:"Hazırlan: Nefes, Beden, Beyin",dk:8,ref:"s. 3",mat:"DUR işareti",i:["Geçiş ne demek? Hızlıca (işareti görünce bırak) ve tamamen (dikkatini yeni oyuna ver).","Birlikte DUR işaretine bakın.",["Nefes: uzun, derin bir nefes al, yavaşça ver. Önce sen göster.","BE"],"Beden: yumruğu sık ve bırak; gergin ve gevşek kas farkını hissettir.","Beyin: \"Yeni oyuna geçmeye hazırım.\" Sonra çocuğa sor: \"Sen beynine ne söyleteceksin?\""]},
     {a:4,t:"Oyun: Top atma ↔ Salon Basketbolu",dk:15,ref:"s. 4",mat:"Top, sepet, skor tahtası",i:["Herkes bir basketbolcu adı seçsin; birer deneme atışı.","Oyun 1 (top atma) ile başla; \"Dur!\" deyince Oyun 2'ye geçilecek.",["Dur! → topu bırak, DUR işaretine bak · Odaklan! → nefes, gevşe · Değiştir! → sepete at.","BE"],"İlk turda top sende olsun; her adımı sesli düşünerek göster.","Sonraki turlarda sor: \"Şimdi beynin sana ne söylüyor?\" Birkaç kez iki yönlü geçiş yap."]},
     {a:5,t:"Gözden geçir: Kartın üzerinden",dk:7,ref:"s. 5",mat:"Beceri Kontrol Kartı 3",i:["Her madde için oyundan somut bir an: \"Dur dediğimde top elindeydi ama hemen bıraktın.\"","Bir iki soru: \"Durdurmak kolay mıydı?\" · \"Nefes yardım etti mi?\" · \"Hangi adım en çok yardım etti?\"","\"Buna 'vites değiştirmek' diyoruz.\""]},
     {a:6,t:"Tekrar oyna: Biraz daha zor",dk:5,ref:"s. 5",i:["\"Dur\" komutunu beklenmedik anlarda ver; geçişleri hızlandır.","Komutu söyleme, yalnızca DUR işaretini göster; adımları çocuk başlatsın.",["Çocuktan kendi kendine \"Dur!\" demesini iste; kendi iç konuşma cümlesini bulsun.","BE"],"Bir tur rolleri değiştir: komutları çocuk versin."]},
     {a:7,t:"Kapanış: Koça NBB'yi öğret",dk:5,ref:"s. 6",koc:"Koç geri döner",i:["Çocuk Kart 3'ü gösterip Nefes-Beden-Beyin'i Koça kendisi öğretsin.","Kısa tur: Koç oynarken çocuk \"Dur!\" desin, Koç üç adımı yapsın.","Kartın ikinci kopyası eve gitsin.","İsteğe bağlı mini bravo: \"Dur dediğimde topu bıraktın, nefes aldın ve öbür oyuna geçtin.\""]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Beceri Kontrol Kartı 3 (bir kopya).","İsteğe bağlı: evde iki kısa oyunla \"Dur, Odaklan, Değiştir\" oyunu."]},
     {g:"Koça söyle",ic:"hand",i:["Zorlanılmayan küçük bir geçişte (oyundan sofraya) üç adımı birlikte denesin: \"Dur… bir nefes… şimdi yemeğe hazırım.\"","Geçişten önce kısa uyarı versin: \"İki dakika sonra duruyoruz.\"","Bu hafta büyük ve zor geçişlerde beceriyi beklemesin."]},
     {g:"Formu doldur",ic:"form",i:["Geçişte en çok zorlayan adım: durmak, odaklanmak ya da değiştirmek.","Çocuğun iç konuşma cümlesi ve Koçla kararlaştırılan."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["adim","En çok zorlayan adım"],["cumle","Çocuğun iç konuşma cümlesi"],["karar","Koçla kararlaştırılan"]]},
     {g:"13. Oturuma hazırlık",ic:"next",i:["Takım Oyuncusu hikâyesini (Kılavuz s. 8–9) iki kopya çoğalt; Serdar'ın repliklerini işaretle.","İstersen küçük bir bayrak ya da renkli kâğıt hazırla (\"takım bayrağı\")."]},
     {done:true} ]
  ]},
13:{
  facts:["≈ 50 dk","Uygulayıcı ve çocuk","Koç açılışta ve kapanışta"],
  phases:[
   [ {g:"Kendin için",ic:"book",i:["Hikâyeyi (Kılavuz s. 8–9) oku; Serdar'ın Dur, Odaklan, Değiştir anlarını işaretle.","İki durak: antrenör bayrağı gösterdikten hemen sonra ve nefes paragrafında.","Çekirdek sorular: 2, 5, 7. Soru 8 \"Peki ya sen?\"de konuşulur."]},
     {g:"Yazdır",ic:"print",i:[["Takım Oyuncusu hikâyesi (Kılavuz s. 8–9) · iki kopya","pdf"],["Tartışma soruları (Kılavuz s. 10)","pdf"],["İnsanlar bu becerileri ne zaman kullanır? (Kılavuz s. 11)","pdf"],["Peki ya sen? (Kılavuz s. 12)","pdf"],["Oturum Değerlendirme ve Takip Formu","pdf"]]},
     {g:"Masaya",ic:"box",i:["Beceri Kontrol Kartı 3","DUR işareti duvarda, çocuğun göz hizasında","Çocuğun kopyası: Serdar'ın replikleri fosforlu kalemle işaretli","İsteğe bağlı küçük bayrak ya da renkli kâğıt"]},
     {g:"12. Oturumdan gelen",ic:"back",prev:12,pf:[["adim","En çok zorlayan adım"],["cumle","İç konuşma cümlesi"],["karar","Koçla kararlaştırılan"]],i:["Evde bir kolay geçişte üç adım denendi mi?"]} ],
   [ {a:1,t:"Karşılama: Geçişler evde nasıl gitti?",dk:5,ref:"s. 2",koc:"Koç odada",i:["Koça sor: Oyun evde oynandı mı? Kolay bir geçişte üç adım denendi mi?",["Bir anı adlandır: \"Durdun, bir nefes aldın ve yemeğe geçtin. Vites değiştirdin.\"","BE"],"Denenmediyse sorun etme; bugün nedenini konuşacağınızı söyle.","Koç çıkar; kapanışta geri dönecek."]},
     {a:2,t:"Hazır ol: Bir futbol maçına gidiyoruz",dk:3,ref:"s. 2",mat:"Beceri Kontrol Kartı 3",i:["Kartı \"gözlük\" yap: Serdar'ın hangi adımları kullandığını yakala.","Roller: Serdar = çocuk · Anlatıcı ve Antrenör = sen.","Okumakta zorlanırsa Serdar'ın repliklerini önce sen fısılda."]},
     {a:3,t:"Hikâyeyi canlandır: Takım Oyuncusu",dk:12,ref:"s. 3",mat:"Hikâye (s. 8–9)",i:["İlk yarı: Serdar kenara alınır, bankı tekmeler; antrenör sessizce bayrağı gösterir.","Durak 1: \"Serdar ne hissediyor? Antrenör neden konuşmadan bayrağı gösterdi?\"",["Durak 2 (nefes paragrafı): \"Hadi Serdar, şimdi sen yap!\" DUR işaretine bak, nefes al, yumrukları gevşet; sen de yap.","BE"],"Kenarda: \"Dur! Takım oyuncusu ol!\" · İkinci yarı: \"Rahatla. Sakin ol. Yapabilirsin!\"","Öfke sorun değil; önemli olan kızgınken ne yapıldığı. \"Ben de tekmelerdim\" derse yargılama."]},
     {a:4,t:"Konuşalım: Serdar ne yaptı?",dk:8,ref:"s. 4",mat:"Tartışma soruları (s. 10)",i:["Soru 2: Oynamaktan izlemeye geçmek için ne yaptı?","Soru 5: Oyundaki becerilerden hangilerini kullandı? Dur · Odaklan · Değiştir.","Soru 7: Kızgın kalsaydı ne olurdu?","Serdar'ın sözcükleri: \"Vites değiştirme zamanı\", \"Dur! Takım oyuncusu ol!\"",["\"Sana durman gerektiğini ne hatırlatabilir?\" Çocuğun \"bayrağını\" seç: DUR işareti, kart, bileklik, gizli işaret.","BE"]]},
     {a:5,t:"İnsanlar ne zaman vites değiştirir?",dk:8,ref:"s. 5",mat:"Form (s. 11)",i:["Çocuk Dur, Sakinleş, Düşün sütunlarını doldursun.","İlk satırı (Baba) birlikte yap; sonra bir iki kişi yeterli. Sözlü de olur.","\"Sakinleş\" sütununda göstersin: omuzlarını düşürmek, nefesi yavaş vermek."]},
     {a:6,t:"Peki ya sen? Kolay ve zor geçişlerim",dk:8,ref:"s. 5",mat:"Form (s. 12)",i:["Önce kolay geçişler: çocuk iyi yaptığını görsün.","Sonra zor geçişler; bulamazsa seçenek sun: sıra beklemek, kaybetmek, tableti kapatmak, teneffüsten derse dönmek.",["Son satır: \"Bu geçişte kendine ne söylersen işe yarar?\" Seçtiği \"bayrağı\" da yaz.","BE"]]},
     {a:7,t:"Kapanış: Benim bayrağım",dk:6,ref:"s. 6",koc:"Koç geri döner",i:["Çocuk Serdar'ı iki cümleyle anlatsın: ne oldu, nasıl vites değiştirdi.","Peki ya sen? formunu Koça göstersin: zor geçiş, kendi cümlesi, kendi bayrağı.","Plan: Koç geçişten önce kısa uyarı verir ve görsel ipucunu gösterir; çocuk cümlesini söyler.","Bir kez prova edin."]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Peki ya sen? formu: zor geçiş, cümle ve bayrak.","İsteğe bağlı: hikâye evde yeniden canlandırılabilir; Antrenör'ü Koç oynar."]},
     {g:"Koça söyle",ic:"hand",i:["Plan tek bir geçişte denensin; çok zor görünüyorsa önce daha kolay bir geçişte.","Fark ettiği vites değiştirme anını adlandırsın: \"Tableti kapattın, nefes aldın ve sofraya geldin.\"","Öfke anında az söz ve sessiz bir işaret; antrenör gibi."]},
     {g:"Formu doldur",ic:"form",i:["Çocuğun seçtiği zor geçiş, kendi cümlesi ve görsel ipucu.","Koçla kararlaştırılan uyarı."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["gecis","Seçilen zor geçiş"],["cumle","Kendi cümlesi"],["bayrak","Görsel ipucu (bayrağı)"],["uyari","Koçun uyarısı"]]},
     {g:"14. Oturuma hazırlık",ic:"next",i:["Koça bir sonraki oturumda baştan sona odada olacağını söyle.","Rüzgâr gülü (yoksa baloncuk) ve saniyeli bir saat hazırla."]},
     {done:true} ]
  ]},

     {g:"13. Oturumdan gelen",ic:"back",prev:13,pf:[["gecis","Zor geçiş"],["cumle","Kendi cümlesi"],["bayrak","Bayrağı"],["uyari","Koçun uyarısı"]],i:["Bayrak planının haftası: Koç uyarı verdi mi, çocuk bayrağına baktı mı?"]} ],
   [ {a:1,t:"Karşılama: Bayrak planı nasıl gitti?",dk:5,ref:"s. 2",koc:"Koç odada",i:["13. Oturumdaki zor geçişi sor: uyarı, bayrak, cümle.",["İşe yarayan anı adlandır: \"Bayrağına baktın, nefes aldın ve tableti kapattın.\"","BE"],"Zorlandıysa bak: ipucu çok mu geç, yeterince güçlü mü?","Koç bu oturumda odada kalır."]},
     {a:2,t:"Hazır ol: İki ipucu",dk:3,ref:"s. 2",mat:"Lütfen Dikkat! kartı",i:["Hatırlat: oyunda söz ipucu (\"Dur\"), Serdar'da işaret ipucu (bayrak).","Bugün ikisi birlikte: Koç \"Lütfen Dikkat!\" der ve DUR kartını gösterir.","Puan kartını göster: 10 antrenman, 10 puana kadar."]},
     {a:3,t:"Görev 1 · Lütfen Dikkat! Göster ve prova et",dk:12,ref:"s. 3",koc:"Koç prova eder",i:["Koçun işini sen göster: kartı kaldır, \"Lütfen Dikkat!\" de.",["Dört adımı göster, sonra çocuk göstersin: durdur · beden dili · sessiz bekle · isteneni yap.","BE"],"Beden dilinde önce uygun olmayanı abart; çocuk farkı bulsun. Göz teması zorunlu değil.","Koçla prova: çocuk oynarken Koç ipucunu verir, davranışa özel geri bildirir, puan kartına √ ya da O koyar.","İki üç tur; bir turda adım atlansın, Koçun düzeltmesini prova et."]},
     {a:4,t:"Görev 1 eve: Plan ve ödül kabı",dk:5,ref:"s. 4",koc:"Koçla",i:["Koça üç Lütfen Dikkat! kartı ve yönergeyi (s. 10) ver.","Başlangıç ve bitiş tarihini ilk kartın arkasına yaz.","Önce kolayca ara verilebilen anlarda; beceri geliştikçe farklı anlarda.","Ödül kabı: çocuk ve Koç üç dört basit etkinlik yazsın; kart dolunca √ sayısından bağımsız çekiliş."]},
     {a:5,t:"Görev 2 · Bir Sorun Var Kedisi → Sakin Kedi",dk:7,ref:"s. 4",i:["Alarmı anlat: köpek gören kedi kamburlaşır, pençelerini çıkarır, tıslar.","\"Bir sorun var!\" dediğinde ikiniz de kedi gibi kasılıp tıslayın.","Sakin Kediye geç: yavaşça gerin, esne, kasları gevşet, sakin nefes.",["Takdir et: \"Bir Sorun Var Kedisi'nden Sakin Kedi'ye geçtin. İşte bu bir vites değiştirme!\"","BE"]]},
     {a:6,t:"Görev 2 · Nefes, gevşeme ve ölçek",dk:13,ref:"s. 5",mat:"Rüzgâr gülü, Sakinleşme Seviyesi Ölçeği (s. 9)",i:["Derin nefes: rüzgâr gülü ne kadar uzun dönüyor? (Baloncuk ya da hayali mum da olur.)","Kar Meleği: avuçlar birleşik, eller başın üstüne, parmak uçlarında uzan, kollar kanat gibi yavaşça iner.",["Ölçek (5 çok gergin → 1 çok rahat): önce ve sonra ikiniz de kendinizi değerlendirin.","BE"],"Puanın düşmemesi de doğal; amaç bedeni fark etmek.","Ölçek şeridini çocuğa ver."]},
     {a:7,t:"Kapanış: Sakin Kedi Koça öğretiyor",dk:5,ref:"s. 6",koc:"Koç odada",i:["Çocuk Koça kedi geçişini, rüzgâr gülünü ve Kar Meleğini göstersin; Koç da yapsın.","İkisi de ölçekte kendini değerlendirsin.","Ev planını gözden geçir; tarihlerin kartın arkasında olduğundan emin ol."]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Üç Lütfen Dikkat! kartı (puan kartlı) ve Koç yönergesi.","Sakinleşme Seviyesi Ölçeği şeridi.","Ödül kabı kâğıtları."]},
     {g:"Koça söyle",ic:"hand",i:["Lütfen Dikkat!: günde bir iki kısa antrenman; ipucunu bir kez ver ve bekle, tekrar tekrar söyleme.","O ceza değildir; hangi adımda desteğe ihtiyaç olduğunu gösterir.","Sakinleşme her gün sakin bir anda (ör. yatmadan önce): rüzgâr gülü, Kar Meleği, ölçek.","İlk kart dolunca bir sonraki oturuma getirsin."]},
     {g:"Formu doldur",ic:"form",i:["Dört adımdan zorlandığı; ölçekte başlangıç ve son puan.","Tercih ettiği nefes aracı; kart tarihleri ve ödül kabı."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["adim","Zorlandığı adım"],["olcek","Ölçek: başlangıç / son"],["nefes","Tercih ettiği nefes aracı"],["tarih","Kart tarihleri"]]},

   [ {a:1,t:"Karşılama: Kartlar ve Sakin Kedi",dk:5,ref:"s. 2",koc:"Koç odada",i:["İlk Lütfen Dikkat! kartına bak; dolduysa ödül kabından çekiliş yapılsın.","Sakin Kedi: önce ve sonra ölçekte fark var mı?",["Bir anı adlandır: \"Bedeninin gerildiğini fark ettin, Kar Meleği yaptın ve kendini yeniden değerlendirdin.\"","BE"],"Puanlarda sorun varsa ipucunun sıklığını ve zamanını ayarla."]},

     {a:3,t:"Görev 3 · Serdar'ın düşünceleri",dk:5,ref:"s. 3",i:["\"Bu adil değil!\" düşüncesi Serdar'ın öfkesini nasıl etkiledi?","Serdar'ın kendine söylediklerini birlikte say.","\"İnsanlar sakinleşmek için kendilerine başka neler söyler?\" (Ona kadar sayarım. Bu geçecek.)"]},
     {a:4,t:"Görev 3 · Poster çalışma sayfası",dk:12,ref:"s. 3",mat:"Çalışma sayfası (s. 7), örnek (s. 8), Duygu Dedektifi (s. 9)",i:["Vites değiştirmekte zorlandığı tek bir durum seç; örnek sayfayı birlikte oku.","Duygu Dedektifi ile birden fazla duygu bulmasına yardım et.","Aklından geçenler: önce yüksek sesle söylediklerinden başla; zorlarsa benzer durumdan örnek ver.",["Her düşüncenin karşısına daha yararlı olanı yazın; çocuk en çok işe yarayanları seçsin.","BE"]]},
     {a:5,t:"Görev 3 · Posterini yap ve yerini seç",dk:8,ref:"s. 4",mat:"Düşünce balonları posteri (s. 10)",i:["Yardımcı düşünceleri balonlara yazsın; isterse çizsin ya da yapıştırsın.","Koçla yer seçin: zor anın yaşandığı yere yakın (masa, kapı, buzdolabı).",["Cümleleri aralarda nefes alarak sesli okusun; önce ve sonra ölçek.","BE"],"Süsleme evde de tamamlanabilir."]},
     {a:6,t:"Görev 4 · DUR ve Sakin Ol",dk:12,ref:"s. 4",mat:"Görsel (s. 11), kartlar (s. 12)",i:["Yanlış alarm: Serdar'ın beyni \"Bu adil değil!\" diye alarm verdi.","Görsele bakarak üç adımı çocuğun ağzından topla: Nefes · Beden · Beyin.","Çocuğa bir DUR ve Sakinleş kartı, Koça bir iki tane daha ver.","İpucunu çocuk seçsin; iyi niyeti hatırlatan bir söz daha iyi çalışır (\"Takım oyuncusu ol\").",["Canlandırın: üzücü olay → üzülme → Koçun ipucu → kart ve NBB. Sonra rolleri değiştirin.","BE"]]},
     {a:7,t:"Kapanış: Benim posterim, benim kartım",dk:5,ref:"s. 5",koc:"Koç odada",i:["Çocuk posterini Koça anlatsın: hangi durum, hangi yardımcı düşünceler.","Kartın yerine ve ipucuna son kez bakın.","Koça çalışma sayfası, Duygu Dedektifi ve yönerge (s. 13) kopyalarını ver."]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["DUR, Sakinleş, Düşün posteri.","DUR ve Sakinleş kartları (çocuğa ve Koça).","Kalan iki Lütfen Dikkat! kartı."]},
     {g:"Koça söyle",ic:"hand",i:["Poster: zor durumdan hemen önce ve sakin bir anda, aralarda nefesle sesli okunur.","Kart: önce sakin anlarda kısa canlandırmalar; alıştıkça zor anlarda ipucu.","İpucu görmezden gelinirse hemen müdahale etme; sakinleşince hikâyeyi hatırlat, niyet belirle, pratik yap, çabayı gör."]},

   [ {a:1,t:"Karşılama: Poster ve kart nasıl gitti?",dk:5,ref:"s. 2",koc:"Koç odada",i:["Çocuğa sor: Poster nerede? Kartı hangi anda kullandın? Kaç √ var?","Koçtan durup sakinleştiği bir anı iste; Etkinlik 3 için not et.",["İşe yaradıysa ipucunu adlandır: \"Koçun 'Takım oyuncusu ol' dedi, kartına baktın ve nefes aldın.\"","BE"],"Zorlandıysa güçlendir: daha erken ipucu, daha anlamlı söz, önce sakin anlarda pratik."]},
     {a:2,t:"Geriye bakış: Vites değiştirme araçlarım",dk:8,ref:"s. 2",mat:"ÇK3 araçları",i:["12. Oyun: \"Basket oynarken en zor komut hangisiydi?\"","13. Takım Oyuncusu: \"Senin bayrağın ne oldu?\"","14. Ev: \"Lütfen Dikkat, Sakin Kedi, rüzgâr gülü: hangisi daha çok yardım ediyor?\"","15. Ev: \"Posterindeki en güçlü cümle hangisi?\"",["\"En iyi aracın hangisi?\" Kartın hangi maddesine yardım ediyor? Birden fazla da olabilir.","BE"]]},
     {a:3,t:"Koçla: Vites değiştirmeye özel övgü",dk:8,ref:"s. 3",koc:"Koçla yürütülür",i:["Üç övgü türünü karşılaştır (Kerem örneği).","Vites değiştirme dilini ver.","Canlı deneme: Koç, Etkinlik 1'deki anı bu dille çocuğa söylesin.","Kalıp: \"… olduğunda durdun, … yaptın ve … geçebildin.\" Son cümle soru olabilir: \"Kendine ne söyledin?\""]},
     {a:4,t:"Koçla: Üç anda teşvik",dk:7,ref:"s. 3",mat:"Teşvik edici sözler (s. 7)",koc:"Koçla yürütülür",i:["Başlarken: \"Bana nasıl yaptığını gösterir misin?\"","Zorlanınca: \"Belki ipucunu çok geç verdim; bir dahaki sefere daha erken söyleyeceğim.\"","Başarınca: \"Derin nefes aldığını ve bedenini gevşettiğini gördüm.\"","Koçun en zor anı için bir cümle seçin."]},
     {a:5,t:"Beceri Takip Formu: Kart 3 ile",dk:7,ref:"s. 4",mat:"Beceri Takip Formu (s. 8)",koc:"Koç odada",i:["Hedefi Kart 3'ün bir maddesiyle ilişkili, somut bir cümleyle yaz.","Kim dolduracak? Büyükanne, bakıcı, öğretmen, dans ya da karate eğitmeni.","Koç ipucunu o yetişkine kısaca öğretsin; yetişkin dolduramazsa Koç dinleyip yazar."]},
     {a:6,t:"Aferin biletleri: ÇK3 maddeleriyle",dk:5,ref:"s. 4",mat:"Aferin biletleri (s. 9)",koc:"Koç odada",i:[["Gösterdiği adımı işaretle: Durdur · Odaklan · Değiştir · Geçiş yap.","BE"],"Becerinin ortaya çıktığı durumu birlikte konuş.","Bilet pazarlık konusu olmaz, geri alınmaz."]},
     {a:7,t:"Kapanış: Bravo, Başardın!",dk:10,ref:"s. 5",koc:"Koç odada",i:["Koç, çocuğun \"en iyi vites değiştirme aracını\" davranışa özel bir cümleyle adlandırsın.","İlk ÇK3 Aferin biletini ver; kocaman bir \"Bravo!\"","ÇK3 özetini Koçla paylaş: durmak · içine dönmek · iç konuşma.","ÇK4'e köprü: bütün beceriler birlikte, planlama ve zaman yönetimi."]} ],
   [ {g:"Eve gidenler",ic:"hand",i:["Teşvik edici sözler sayfası (Koça).","Kart 3'lü Beceri Takip Formu(ları).","ÇK3 Aferin biletleri."]},
     {g:"Koça söyle",ic:"hand",i:["Haftada en az üç kez vites değiştirmeye özel övgü söylesin.","Poster, DUR ve Sakinleş kartı ve Sakin Kedi rutini sürsün.","ÇK1–ÇK3 araçları ÇK4 boyunca da kullanılacak."]},
     {g:"ÇK4'e geçmeden kontrol et",ic:"form",i:["Çocuk hatırlatmayla da olsa en az bir sakinleşme aracını kendisi başlatabiliyor.","Koç ipucunu erken ve tutarlı veriyor, davranışa özel övgüyü kullanıyor.","Aile ÇK1–ÇK3 araçlarını ÇK4 boyunca sürdürmeye hazır.","Eksik varsa ilgili ev çalışmalarını sürdür."]},
     {g:"Sonraki oturum için kaydet",ic:"save",f:[["enIyi","En iyi vites değiştirme aracı"],["takip","Beceri Takip Formu: hedef ve yetişkin(ler)"],["hazir","ÇK4'e hazır mı?"]]},

  ]},

     {a:3,t:"Yarışmaya hazırlık: Roller ve oyun planı",dk:10,ref:"s. 3",mat:"Oyun planı (s. 8), Saatle Yarış (s. 9)",koc:"Koç rolünde",i:["Rolleri tanıt: yarışmacı, sunucu, zaman yöneticisi, Koç.","Dört görev çantasını göster, kısaca açıkla.",["Sırayı çocuk seçsin; zorlanırsa \"Önce hangisi kolay olur?\" diye sor, sırayı sen belirleme.","SO"],"DUR! alanı 2. görevden sonra: mola ve Koçla değerlendirme, görev sayılmaz.","Koç \"Bir Kazanan Gibi Düşün\" kartını yüksek sesle okusun."]},
     {a:4,t:"Yarışma: Hazır ol, Pozisyon al, Başla!",dk:15,ref:"s. 4",koc:"Koç rolünde",i:["Piyon Başlangıç'ta; \"Hazır ol, Pozisyon al, Başla!\" Zamanlayıcı başlar.","Her görev bitince piyon ilerler; zaman yöneticisi kalan süreyi söyler ve yazar.","DUR! alanında Koç: üç derin nefes, bir Kar Meleği, iyi gidenleri söyle, bir teşvik kartı oku.",["Sunucu becerileri adlandırsın: \"Yarışmacımız planını kontrol ediyor.\"","SO"],"Görev uzarsa önce planı gözden geçir; gerekirse öğe sayısını azalt.","Bitişte önce süreci adlandır, sonucu değil."]},
     {a:5,t:"Gözden geçir: Kartın üzerinden",dk:8,ref:"s. 5",mat:"Beceri Kontrol Kartı 4",i:["Her madde için yarışmadan somut bir an hatırla.","Bir iki soru: \"Planın nasıl yardım etti?\" · \"En zor görevde ne yaptın?\" · \"Bir dahaki sefere neyi farklı yapardın?\"","\"İşte kazanan böyle düşünür!\""]},
     {a:6,t:"Kapanış: Kazanan gibi düşün",dk:7,ref:"s. 5",koc:"Koç odada",i:["Çocuk \"Kazanan biri…\" kurallarından en sevdiğini Koça söylesin.","Koç, yarışmada gördüğü bir anı davranışa özel bir cümleyle söylesin.","Kartın ikinci kopyası eve gitsin.","İsteğe bağlı mini bravo: \"Yapboz zorlaşınca durdun, nefes aldın ve plana döndün.\""]} ],

     {a:3,t:"Hikâyeyi canlandır: Bir Kazanan Gibi Düşün",dk:12,ref:"s. 3",mat:"Hikâye (s. 7–8), oyun planı, yapışkan notlar",koc:"Koç büyükanne",i:["Roller: Anlatıcı = sen · Arda = çocuk · Büyükanne = Koç.",["Hikâyeyi masada kur: Arda nota yazdıkça çocuk da yazıp yola yapıştırsın, görev bittikçe piyonu ilerletsin.","SO"],"\"Asla bitiremem!\": \"Arda ne hissediyor?\"","\"Bir oyun planı yapacağız\": \"Oyun planı ne işe yarar?\"","\"Sadece altı şey varmış\": \"İş mi küçüldü, bakışı mı?\"","Sonda: \"Kartın hangi maddelerini kullandı?\""]},

const ACT_C=["slate","teal","rust","plum","blue","teal-d","plum-d"];
