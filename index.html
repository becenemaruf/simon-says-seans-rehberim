<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Simon Says Seans Rehberim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: brand bar → hero with Simon → colour-banded book sections of session cards.
   Session view: book-coloured header band → three phase tabs (each phase has its own guide colour) → checklist panel. */
:root{
  --bg:#F4F7F7; --surface:#FFFFFF; --ink:#1E2427; --muted:#56636A; --line:#D7E0E2;
  --teal:#1F6F7A; --teal-d:#15525A; --teal-s:#EAF4F5;
  --rust:#B8521C; --rust-d:#8A3B12; --rust-s:#FDF1E9;
  --plum:#8A3C8C; --plum-d:#6A2A6C; --plum-s:#F5ECF5;
  --blue:#2E5C9A; --blue-s:#E8EEF7;
  --slate:#56636A; --slate-s:#EEF1F2;
  --on:#FFFFFF;
  --f-display:'Lexend',system-ui,sans-serif; --f-body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111719; --surface:#192124; --ink:#E5EBED; --muted:#9AA7AD; --line:#2A363A;
  --teal:#3E9AA6; --teal-d:#5FB3BE; --teal-s:#16302F;
  --rust:#C9642C; --rust-d:#E58A55; --rust-s:#33221A;
  --plum:#9E52A0; --plum-d:#C98BCB; --plum-s:#2E2030;
  --blue:#4A7BBE; --blue-s:#1C2636; --slate:#6F7C82; --slate-s:#222B2E; --on:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#192124; --ink:#E5EBED; --muted:#9AA7AD; --line:#2A363A;
  --teal:#3E9AA6; --teal-d:#5FB3BE; --teal-s:#16302F;
  --rust:#C9642C; --rust-d:#E58A55; --rust-s:#33221A;
  --plum:#9E52A0; --plum-d:#C98BCB; --plum-s:#2E2030;
  --blue:#4A7BBE; --blue-s:#1C2636; --slate:#6F7C82; --slate-s:#222B2E; --on:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
.stripe{height:5px;background:linear-gradient(90deg,var(--teal) 0 25%,var(--rust) 25% 50%,var(--plum) 50% 75%,var(--blue) 75%)}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.logo i:nth-child(1){background:var(--teal)}.logo i:nth-child(2){background:var(--rust)}.logo i:nth-child(3){background:var(--plum)}.logo i:nth-child(4){background:var(--blue)}
.brand .ss{font-family:var(--f-display);font-weight:700;font-size:18px}
.brand .sr{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--teal-d)}
.back{margin-left:auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-family:var(--f-display);font-size:14px;font-weight:600;cursor:pointer}
.back:hover{border-color:var(--teal);color:var(--teal)}

/* hero */
.hero{background:var(--teal-s)}
.hero .wrap{display:flex;align-items:center;gap:24px;padding-block:22px}
.hero img{width:min(240px,34vw);height:auto;flex-shrink:0;mix-blend-mode:multiply}
:root[data-theme="dark"] .hero img{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero img{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:6px}}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.hero h1 span{color:var(--teal-d)}
.hero p{margin:0;max-width:56ch;color:var(--muted)}
.phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.phases span{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:14px;background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px}
.phases b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--on);font-size:13px}
@media (max-width:560px){.hero .wrap{flex-direction:column;align-items:flex-start}.hero img{width:180px}}

main{padding-block:8px 64px}
.book{margin-top:26px}
.bookh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bc);color:var(--on);border-radius:14px;padding:10px 16px;margin-bottom:12px}
.bookh .tag{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.bookh h2{font-family:var(--f-display);font-size:19px;margin:0}
.bookh .sk{font-size:14px;opacity:.9;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.card{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--bc);border-radius:14px;padding:14px;cursor:pointer;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,40,45,.10)}
.num{width:40px;height:40px;border-radius:12px;background:var(--bs);color:var(--bc);font-family:var(--f-display);font-weight:700;font-size:19px;display:grid;place-items:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.card.ready .num{background:var(--bc);color:var(--on)}
.ct{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct b{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.3}
.ct .meta{font-size:13px;color:var(--muted)}
.pill{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:2px}
.pill.pend{background:var(--slate-s);color:var(--muted)}
.pill.ready{background:var(--bc);color:var(--on)}
.pill.doneP{background:var(--teal-s);color:var(--teal-d)}

/* session */
.shead{border-radius:18px;padding:20px 22px;color:var(--on);background:var(--bc);margin-top:18px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.shead.multi{background:linear-gradient(120deg,var(--teal-d),var(--teal) 55%,var(--blue))}
.shead .big{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.9;opacity:.95}
.shead .k{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.shead h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,30px);line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:600}
.sico{width:132px;height:132px;margin-left:auto;background:#FFFFFF;border-radius:22px;padding:10px;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sico svg{width:100%;height:100%;display:block}
@media (max-width:640px){.shead{flex-wrap:wrap}.sico{width:88px;height:88px;padding:6px;border-radius:16px}.shead .big{font-size:48px}}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0}
.tab .ring{--p:0;width:42px;height:42px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--pc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.tab .ring b{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.tab .tx{display:flex;flex-direction:column;min-width:0}
.tab .tx small{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tab .tx strong{font-family:var(--f-display);font-size:16px;line-height:1.2}
.tab .tx em{font-style:normal;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--pc);background:var(--ps)}
@media (max-width:620px){.tabs{gap:6px}.tab{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}.tab .tx strong{font-size:14px}.tab .tx em{display:none}}

.panel{background:var(--surface);border-radius:18px;padding:18px 20px;border:1px solid var(--line);border-top:5px solid var(--pc)}
.lead{display:flex;gap:10px;align-items:center;background:var(--ps);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-weight:600}
.grp{display:flex;flex-direction:column;gap:2px;padding-block:12px;border-bottom:1px dashed var(--line)}
.grp:last-of-type{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.gi{width:34px;height:34px;border-radius:10px;background:var(--ps);color:var(--pc);display:grid;place-items:center;flex-shrink:0}
.gi svg{width:19px;height:19px}
.gh h4{font-family:var(--f-display);font-size:16px;margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:7px 10px;border-radius:10px;max-width:74ch}
.chk:hover{background:var(--ps)}
.chk input{appearance:none;width:24px;height:24px;border:2px solid var(--pc);border-radius:7px;flex-shrink:0;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.chk input:checked{background:var(--pc)}
.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked ~ .lt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.lt{flex:1;min-width:0}
.pdf{font-size:12px;font-weight:700;color:var(--rust);background:var(--rust-s);border-radius:999px;padding:2px 10px;white-space:nowrap;align-self:center}
.sk{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px;color:var(--on)}
.note{margin:2px 10px;color:var(--muted)}
.prevbox{margin:4px 10px 6px;border-radius:12px;background:var(--ps);padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 16px;font-size:15px}
.prevbox span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.prevbox b{font-weight:600}

/* timeline */
.tl{display:flex;gap:3px;border-radius:12px;overflow:hidden;margin:2px 0 14px}
.tl button{border:0;color:var(--on);font-family:var(--f-display);font-size:12px;padding:6px 8px;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.tl b{font-size:15px}
.tl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:90px}
.act + .act{margin-top:12px}
.acth{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--as)}
.acth .an{width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--on);font-family:var(--f-display);font-weight:700;display:grid;place-items:center;flex-shrink:0}
.acth b{font-family:var(--f-display);font-size:17px;flex:1;min-width:0}
.acth .ok{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--ac)}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;padding:10px 16px 0}
.tags span{border-radius:999px;padding:2px 10px;font-weight:600;background:var(--slate-s);color:var(--muted)}
.tags .t-dk{background:var(--ac);color:var(--on)}
.tags .t-mat{background:var(--rust-s);color:var(--rust-d)}
.tags .t-koc{background:var(--blue-s);color:var(--blue)}
.act .items{padding:6px 6px 10px}
.act .chk input{border-color:var(--ac)} .act .chk input:checked{background:var(--ac)} .act .chk:hover{background:var(--as)}

.field{display:flex;flex-direction:column;gap:4px;max-width:74ch;padding:6px 10px}
.field label{font-weight:600;font-size:15px}
.field input{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--pc);outline:none}
.done{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:16px;padding:14px 16px;background:var(--ps)}
.done button{border:0;background:var(--pc);color:var(--on);border-radius:12px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer}
.done.is button{background:var(--teal)}
.foot{font-size:13px;color:var(--muted);margin-top:14px}
.empty{display:flex;flex-direction:column;gap:6px;max-width:60ch}
.empty h3{font-family:var(--f-display);margin:0;font-size:19px}
.nextp{display:flex;justify-content:flex-end;margin-top:14px}
.nextp button{border:0;background:var(--pn);color:var(--on);border-radius:12px;padding:11px 18px;font-family:var(--f-display);font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>

  <button class="brand" id="brand" type="button" aria-label="Ana ekran"><span class="logo"><i></i><i></i><i></i><i></i></span><span class="ss">Simon Says</span><span class="sr">Seans Rehberim</span></button>
  <button class="back" id="home" type="button" hidden>← Tüm oturumlar</button>
</div><div class="stripe"></div></header>

<div id="view"></div>

     {g:"3. Oturuma hazırlık",ic:"next",i:["Koç getirecek: Koç Raporu (Görev 1 işaretlenmiş).","3. Oturumda Çalışma Kitabı 1 başlıyor; Beceri Kontrol Kartı 1'i hazırla."]},

const ACT_C=["slate","teal","rust","plum","blue","teal-d","plum-d"];

/* ---- saklama: yalnızca bu cihaz ---- */
const mem={};
const st=k=>{if(k in mem)return mem[k];try{const v=localStorage.getItem("ssr:"+k);return v===null?null:JSON.parse(v)}catch(e){return null}};
const put=(k,v)=>{mem[k]=v;try{localStorage.setItem("ssr:"+k,JSON.stringify(v))}catch(e){}};
const $=id=>document.getElementById(id);
const cv=c=>`--bc:var(--${c});--bs:var(--${c}-s)`;
const pv=p=>`--pc:var(--${PH[p].c});--ps:var(--${PH[p].c}-s)`;

function keys(n,p){const out=[];const P=DATA[n].phases[p];P.forEach((b,bi)=>{(b.i||[]).forEach((_,i)=>out.push(`s${n}p${p}b${bi}i${i}`))});return out}
function pct(n,p){const k=keys(n,p);if(!k.length)return 0;return Math.round(100*k.filter(x=>st(x)).length/k.length)}

function home(){
  $("home").hidden=true;
  let h=`<section class="hero"><div class="wrap gut"><img src="${IMG}" alt="Simon ve dört beyin becerisi: Çalışma Belleği, Bilişsel Esneklik, Tepki Engelleme, Sonuç Odaklı Düşünme">
  <div><h1>Hangi oturuma <span>hazırlanıyorsun?</span></h1>
  <p>Basılı uygulama kılavuzunun yanında kullanılır. Her oturumda ne yapacağını üç adımda gösterir; ayrıntı için kılavuzun ilgili sayfasına yönlendirir.</p>
  <div class="phases">${PH.map(p=>`<span><b style="background:var(--${p.c})">${p.n}</b>${p.t}</span>`).join("")}</div></div></div></section><main class="gut"><div class="wrap">`;
  BOOKS.forEach((b,bi)=>{
    h+=`<section class="book" style="${cv(b.c)}"><div class="bookh"><span class="tag">${b.tag}</span><h2>${b.name}</h2><span class="sk">${b.sk}</span></div><div class="grid">`+
    SESS.filter(s=>s[1]===bi).map(s=>{const r=!!DATA[s[0]];const d=st(`s${s[0]}done`);
      const pill=d?`<span class="pill doneP">✓ Tamamlandı</span>`:r?`<span class="pill ready">Hazır</span>`:`<span class="pill pend">Hazırlanacak</span>`;
      return `<button class="card ${r?'ready':''}" type="button" data-s="${s[0]}"><span class="num">${s[0]}</span><span class="ct"><b>${s[2]}</b><span class="meta">${s[3]}</span>${pill}</span></button>`}).join("")+`</div></section>`;
  });
  $("view").innerHTML=h+`</div></main>`;
  try{history.replaceState(null,"","#ana")}catch(e){}
}

function item(id,txt,extra){const on=st(id)?"checked":"";return `<label class="chk"><input type="checkbox" data-k="${id}" ${on}><span class="lt">${txt}${extra&&extra!=="pdf"?sk(extra):""}</span>${extra==="pdf"?`<span class="pdf">PDF</span>`:""}</label>`}

function phaseHTML(n,p){
  const P=DATA[n].phases[p]; let h="";
  if(p===1){
    const acts=P.filter(b=>b.a);
    h+=`<div class="tl" aria-label="Oturum akışı">${acts.map((b,i)=>`<button type="button" data-jump="a${b.a}" style="flex:${b.dk};background:var(--${ACT_C[i%ACT_C.length]})" title="${b.t}"><b>${b.a}</b><span>${b.dk} dk</span></button>`).join("")}</div>`;
  }
  P.forEach((b,bi)=>{
    const base=`s${n}p${p}b${bi}`;
    if(b.a){
      const c=ACT_C[(b.a-1)%ACT_C.length];
      const ks=b.i.map((_,i)=>base+"i"+i); const dn=ks.filter(k=>st(k)).length;
      h+=`<article class="act" id="a${b.a}" style="--ac:var(--${c});--as:var(--${c.replace('-d','')}-s)"><div class="acth"><span class="an">${b.a}</span><b>${b.t}</b><span class="ok" data-ok="${base}">${dn}/${ks.length}</span></div>
      <div class="tags"><span class="t-dk">${b.dk} dk</span>${b.mat?`<span class="t-mat">Materyal: ${b.mat}</span>`:""}${b.koc?`<span class="t-koc">${b.koc}</span>`:""}<span>Kılavuz ${b.ref}</span></div>
      <div class="items">${b.i.map((x,i)=>Array.isArray(x)?item(base+"i"+i,x[0],x[1]):item(base+"i"+i,x)).join("")}</div></article>`;return}
    if(b.done){const d=st(`s${n}done`);h+=`<div class="done ${d?'is':''}"><button type="button" id="doneBtn">${d?"✓ Seans tamamlandı":"Seansı tamamlandı olarak işaretle"}</button><span>${d?"Ana ekranda bu oturum tamamlandı olarak görünür.":"Bütün maddeleri bitirdiğinde işaretle."}</span></div>`;return}
    h+=`<div class="grp"><div class="gh"><span class="gi">${ICON[b.ic]||""}</span><h4>${b.g}</h4></div>`;
    if(b.note) h+=`<p class="note">${b.note}</p>`;
    if(b.prev){const vals=b.pf.map(f=>[f[1],st(`s${b.prev}f${f[0]}`)]);const any=vals.some(v=>v[1]);
      h+=`<div class="prevbox">${any?vals.map(v=>`<div><span>${v[0]}</span><b>${v[1]||"—"}</b></div>`).join(""):`<p style="margin:0">${b.prev}. Oturumda henüz not kaydedilmedi. Notlar, o oturumun “Seansı tamamla” bölümünde girildiğinde burada görünür.</p>`}</div>`}
    if(b.i) h+=b.i.map((x,i)=>Array.isArray(x)?item(base+"i"+i,x[0],x[1]):item(base+"i"+i,x)).join("");
    if(b.f) h+=b.f.map(f=>`<div class="field"><label for="f${n}${f[0]}">${f[1]}</label><input id="f${n}${f[0]}" data-f="s${n}f${f[0]}" value="${(st(`s${n}f${f[0]}`)||"").replace(/"/g,"&quot;")}"></div>`).join("");
    h+=`</div>`;
  });
  if(p<2) h+=`<div class="nextp" style="--pn:var(--${PH[p+1].c})"><button type="button" data-ph="${p+1}">Sonraki: ${PH[p+1].t} →</button></div>`;
  return h+`<p class="foot">İşaretler ve notlar yalnızca bu cihazda saklanır.</p>`;
}

let curS=0,curP=0;
function session(n,p=0){
  curS=n;curP=p;
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n];
  $("home").hidden=false;
  const tabs=PH.map((ph,i)=>{const v=D?pct(n,i):0;return `<button class="tab" role="tab" type="button" data-ph="${i}" aria-selected="${i===p}" style="${pv(i)}"><span class="ring" style="--p:${v}"><b>${ph.n}</b></span><span class="tx"><small>BÖLÜM ${ph.n}</small><strong>${ph.t}</strong><em>${ph.e}</em></span></button>`}).join("");
  $("view").innerHTML=`<main class="gut"><div class="wrap">
   <section class="shead ${s[1]===0?'multi':''}" style="${cv(b.c)}"><span class="big">${n}</span><div><div class="k">${b.tag} · ${s[3]}</div><h1>${s[2]}</h1>${D?`<div class="facts">${D.facts.map(f=>`<span>${f}</span>`).join("")}</div>`:""}</div>${SICON[n]?`<span class="sico">${SICON[n]}</span>`:""}</section>
   <div class="tabs" role="tablist">${tabs}</div>
   <div class="panel" style="${pv(p)}">${D?phaseHTML(n,p):`<div class="empty"><h3>${PH[p].t}: hazırlanıyor</h3><p style="margin:0">Bu oturumun kontrol listesi henüz eklenmedi.</p></div>`}</div>
  </div></main>`;
  try{history.replaceState(null,"","#oturum-"+n)}catch(e){}
}
function refresh(){
  if(!DATA[curS])return;
  document.querySelectorAll(".tab").forEach((t,i)=>t.querySelector(".ring").style.setProperty("--p",pct(curS,i)));
  document.querySelectorAll("[data-ok]").forEach(el=>{const b=el.dataset.ok;const all=[...document.querySelectorAll(`[data-k^="${b}i"]`)];el.textContent=all.filter(x=>x.checked).length+"/"+all.length});
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-s]"); if(c){session(+c.dataset.s);window.scrollTo({top:0});return}
  const t=e.target.closest("[data-ph]"); if(t){session(curS,+t.dataset.ph);document.querySelector(".tabs").scrollIntoView({block:"start",behavior:"smooth"});return}
  const j=e.target.closest("[data-jump]"); if(j){$(j.dataset.jump).scrollIntoView({behavior:"smooth"});return}
  if(e.target.id==="doneBtn"){const k=`s${curS}done`;put(k,!st(k));session(curS,curP);return}
});
document.addEventListener("change",e=>{if(e.target.dataset.k){put(e.target.dataset.k,e.target.checked);refresh()}});
document.addEventListener("input",e=>{if(e.target.dataset.f)put(e.target.dataset.f,e.target.value)});
$("home").onclick=()=>{home();window.scrollTo({top:0})};
$("brand").onclick=()=>{home();window.scrollTo({top:0})};
const m=location.hash.match(/^#oturum-(\d+)$/);
if(m&&+m[1]>=1&&+m[1]<=20)session(+m[1]);else home();
</script>
</body>
